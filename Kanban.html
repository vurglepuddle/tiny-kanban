                    <path d="M4 6.5h5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
                  </svg>
                  New Board
                </button>
                <div className={`backup-status backup-menu-status ${backupStatus.kind}`} title={backupStatus.text}>
                  <div className="backup-dot"></div>
                  <span>{backupStatus.text}</span>
                </div>
              </div>
            )}
          </div>
        </header>
      );
    }

    /* ─── Column ─── */
    function Column({
      def, colIdx, cards, labels, filterIds,
      draggingId, dropTarget, addingTo,
      draggingCol, colDropIdx,
      onDragStart, onDragEnd, onDragOverArea, onDrop,
      onCardPointerDown, onCardPointerMove, onCardPointerUp, onCardPointerCancel,
      onColDragStart, onColDragOver, onColDragEnd,
      onEdit, onAdd, onStartAdd, onCancelAdd,
      onRename, onColor, onDelete, onSortDue, dueSortDir,
      onToggleChecklistItem, onToggleCardComplete, onToggleFilter,
    }) {
      const isCardDropActive = dropTarget?.col === def.id;
      const adding = addingTo === def.id;
      const [renaming, setRenaming] = useState(false);
      const [colorOpen, setColorOpen] = useState(false);
      const [renameVal, setRenameVal] = useState(def.label);
      const renameRef = useRef(null);
      const colorRef = useRef(null);

      useEffect(() => { if (renaming) { renameRef.current?.focus(); renameRef.current?.select(); } }, [renaming]);
      useEffect(() => { if (!renaming) setRenameVal(def.label); }, [def.label, renaming]);
      useEffect(() => {
        if (!colorOpen) return;
        const onPointerDown = (e) => {
          if (!colorRef.current?.contains(e.target)) setColorOpen(false);
        };
        const onKey = (e) => {
          if (e.key === 'Escape') setColorOpen(false);
        };
        document.addEventListener('pointerdown', onPointerDown);
        document.addEventListener('keydown', onKey);
        return () => {
          document.removeEventListener('pointerdown', onPointerDown);
          document.removeEventListener('keydown', onKey);
        };
      }, [colorOpen]);

      const finishRename = (commit) => {
        setRenaming(false);
        if (commit) {
          const t = renameVal.trim();
          if (t && t !== def.label) onRename(def.id, t);
          else setRenameVal(def.label);
        } else {
          setRenameVal(def.label);
        }
      };

      const filterSet = filterIds;
      const isVisible = (c) => filterSet.length === 0 || (c.labels || []).some(id => filterSet.includes(id));
      const visibleCount = filterSet.length === 0 ? cards.length : cards.filter(isVisible).length;

      const showColDropBefore = draggingCol && draggingCol !== def.id && colDropIdx === colIdx;
      const showColDropAfter  = draggingCol && draggingCol !== def.id && colDropIdx === colIdx + 1;

      const colClass = [
        'column',
        isCardDropActive ? 'drop-active' : '',
        draggingCol === def.id ? 'col-dragging' : '',
        showColDropBefore ? 'col-drop-before' : '',
        showColDropAfter ? 'col-drop-after' : '',
      ].filter(Boolean).join(' ');

      return (
        <section
          className={colClass}
          aria-label={`${def.label} column`}
          onDrop={e => onDrop(e, def.id)}
          onDragOver={e => {
            if (draggingCol !== null && draggingCol !== undefined) onColDragOver(e, colIdx);
            else e.preventDefault();
          }}
        >
          <div
            className="col-header"
            draggable={!renaming}
            onDragStart={e => onColDragStart(e, def.id, colIdx)}
            onDragEnd={onColDragEnd}
          >
            <div className="col-color-wrap no-drag" ref={colorRef}>
              <button
                type="button"
                className="col-dot"
                style={{ background: def.color }}
                onClick={e => { e.stopPropagation(); setColorOpen(open => !open); }}
                onMouseDown={e => e.stopPropagation()}
                aria-label={`Change ${def.label} color`}
                title="Change column color"
              ></button>
              {colorOpen && (
                <div className="col-color-menu" role="menu" aria-label="Column colors">
                  {COL_PALETTE.map(color => (
                    <button
                      key={color}
                      type="button"
                      className={`col-color-swatch${color === def.color ? ' active' : ''}`}
                      style={{ background: color }}
                      onClick={e => {
                        e.stopPropagation();
                        onColor(def.id, color);
                        setColorOpen(false);
                      }}
                      aria-label={`Set color ${color}`}
                      aria-pressed={color === def.color}
                    ></button>
                  ))}
                </div>
              )}
            </div>
            {renaming ? (
              <input
                ref={renameRef}
                className="col-rename-input"
                value={renameVal}
                onChange={e => setRenameVal(e.target.value)}
                onBlur={() => finishRename(true)}
                onKeyDown={e => {
                  if (e.key === 'Enter') finishRename(true);
                  if (e.key === 'Escape') finishRename(false);
                }}
                aria-label="Column name"
              />
            ) : (
              <h2
                className="col-title"
                tabIndex={0}
                onClick={() => setRenaming(true)}
                onKeyDown={e => { if (e.key === 'Enter' || e.key === 'F2') setRenaming(true); }}
                title="Click to rename"
              >{def.label}</h2>
            )}
            <button
              type="button"
              className="col-sort-due no-drag"
              onClick={e => { e.stopPropagation(); onSortDue(def.id); }}
              onMouseDown={e => e.stopPropagation()}
              aria-label={dueSortDir === 'asc' ? `Sort ${def.label} due dates earliest first` : `Sort ${def.label} due dates latest first`}
              title={dueSortDir === 'asc' ? 'Sort this column earliest first' : 'Sort this column latest first'}
            >
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                {dueSortDir === 'asc' ? (
                  <path d="M6 10V2.2M2.8 5.4L6 2.2l3.2 3.2" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                ) : (
                  <path d="M6 2v7.8M2.8 6.6L6 9.8l3.2-3.2" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                )}
              </svg>
            </button>
            <span
              className="col-count"
              aria-label={filterSet.length > 0 ? `${visibleCount} of ${cards.length} visible` : `${cards.length} cards`}
              title={filterSet.length > 0 ? `${visibleCount} visible · ${cards.length} total` : ''}
            >{filterSet.length > 0 ? `${visibleCount}/${cards.length}` : cards.length}</span>
            <button
              className="col-delete no-drag"
              onClick={e => { e.stopPropagation(); onDelete(def.id); }}
              onMouseDown={e => e.stopPropagation()}
              aria-label={`Delete ${def.label} column`}
              title="Delete column"
            >
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
                <path d="M2 2l7 7M9 2l-7 7" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/>
              </svg>
            </button>
          </div>

          <div className="cards-area" data-col-id={def.id} onDragOver={e => onDragOverArea(e, def.id)} role="list">
            {(() => {
              const items = [];
              const placeholderAt = isCardDropActive ? dropTarget.idx : -1;
              for (let i = 0; i <= cards.length; i++) {
                if (i === placeholderAt) items.push(<div key="ph" className="drop-placeholder" role="presentation" />);
                if (i < cards.length) {
                  const c = cards[i];
                  if (!isVisible(c) && draggingId !== c.id) continue; // hide filtered cards (but keep source rendering rules)
                  items.push(
                    <KanbanCard
                      key={c.id}
                      card={c}
                      idx={i}
                      colId={def.id}
                      labels={labels}
                      filterIds={filterIds}
                      isDragging={draggingId === c.id}
                      onDragStart={onDragStart}
                      onDragEnd={onDragEnd}
                      onPointerDown={onCardPointerDown}
                      onPointerMove={onCardPointerMove}
                      onPointerUp={onCardPointerUp}
                      onPointerCancel={onCardPointerCancel}
                      onEdit={onEdit}
                      onToggleChecklistItem={onToggleChecklistItem}
                      onToggleComplete={onToggleCardComplete}
                      onToggleFilter={onToggleFilter}
                    />
                  );
                }
              }
              return items;
            })()}
          </div>

          {adding ? (
            <AddForm onAdd={(t, n) => onAdd(def.id, t, n)} onCancel={onCancelAdd} />
          ) : (
            <button className="add-btn" onClick={onStartAdd} aria-label={`Add card to ${def.label}`}>
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                <path d="M6.5 1v11M1 6.5h11" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
              </svg>
              Add card
            </button>
          )}
        </section>
      );
    }

    /* ─── KanbanCard ─── */
    function KanbanCard({
      card, idx, colId, labels, filterIds, isDragging,
      onPointerDown, onPointerMove, onPointerUp, onPointerCancel,
      onEdit, onToggleChecklistItem, onToggleComplete, onToggleFilter,
    }) {
      const suppressClickRef = useRef(false);
      const suppressClickUntilRef = useRef(0);
      const cardLabels = (card.labels || [])
        .map(id => labels.find(l => l.id === id))
        .filter(Boolean);

      const checklist = card.checklist || [];
      const ckTotal = checklist.length;
      const ckDone  = checklist.filter(i => i.done).length;
      const ckOpen = checklist.filter(i => !i.done);
      const ckVisible = ckOpen.slice(0, 3);
      const ckExtra = ckOpen.length - ckVisible.length;
      const dueState = dueStatus(card);

      const onCardClick = (e) => {
        const target = e.target.closest ? e.target : e.target.parentElement;
        if (target?.closest('.no-drag')) return;
        const globalSuppressUntil = window.__kanbanSuppressCardClickUntil || 0;
        if (suppressClickRef.current || Date.now() < suppressClickUntilRef.current || Date.now() < globalSuppressUntil) {
          e.preventDefault();
          suppressClickRef.current = false;
          return;
        }
        onEdit(card);
      };

      const onCardPointerDown = (e) => {
        onPointerDown(e, card.id, colId, idx);
      };

      const onCardPointerMove = (e) => {
        if (onPointerMove(e)) suppressClickRef.current = true;
      };

      const onCardPointerUp = (e) => {
        if (onPointerUp(e)) {
          suppressClickRef.current = true;
          suppressClickUntilRef.current = Date.now() + 500;
          setTimeout(() => { suppressClickRef.current = false; }, 500);
        }
      };

      const onCardPointerCancel = (e) => {
        if (onPointerCancel(e)) {
          suppressClickRef.current = true;
          suppressClickUntilRef.current = Date.now() + 500;
          setTimeout(() => { suppressClickRef.current = false; }, 500);
        }
      };

      return (
        <article
          className={`card${isDragging ? ' is-dragging' : ''}`}
          draggable={false}
          role="listitem"
          tabIndex={0}
          data-col-id={colId}
          data-idx={idx}
          data-card-id={card.id}
          aria-label={`${card.title}${card.notes ? '. ' + card.notes : ''}. Click or press Enter to edit.`}
          onPointerDown={onCardPointerDown}
          onPointerMove={onCardPointerMove}
          onPointerUp={onCardPointerUp}
          onPointerCancel={onCardPointerCancel}
          onClick={onCardClick}
          onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); onEdit(card); } }}
        >
          {cardLabels.length > 0 && (
            <div className="card-labels" aria-label="Labels">
              {cardLabels.map(lab => {
                const active = filterIds.includes(lab.id);
                return (
                  <button
                    key={lab.id}
                    type="button"
                    className={`label-pill no-drag${active ? ' filter-active' : ''}`}
                    style={{ background: lab.color }}
                    draggable={false}
                    onClick={e => { e.stopPropagation(); onToggleFilter(lab.id); }}
                    onMouseDown={e => e.stopPropagation()}
                    title={active ? `Remove "${lab.name}" filter` : `Filter by "${lab.name}"`}
                    aria-pressed={active}
                  >{lab.name}</button>
                );
              })}
            </div>
          )}
          <div className="card-title-row">
            <button
              type="button"
              className={`ck-box no-drag${card.complete ? ' done' : ''}`}
              draggable={false}
              onClick={e => { e.stopPropagation(); onToggleComplete(colId, card.id); }}
              onMouseDown={e => e.stopPropagation()}
              aria-pressed={!!card.complete}
              aria-label={card.complete ? `Mark "${card.title}" incomplete` : `Mark "${card.title}" complete`}
              title={card.complete ? 'Mark incomplete' : 'Mark complete'}
            >
              {card.complete && (
                <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
                  <path d="M1.5 5l2.2 2.2L8.5 2.4" stroke="white" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              )}
            </button>
            <p className="card-title">{card.title}</p>
          </div>
          {card.notes && <p className="card-notes">{linkify(card.notes)}</p>}

          {ckVisible.length > 0 && (
            <div className="ck-mini" role="group" aria-label="Open checklist items">
              {ckVisible.map(item => (
                <div key={item.id} className={`ck-row${item.done ? ' done' : ''}`}>
                  <button
                    type="button"
                    className={`ck-box no-drag${item.done ? ' done' : ''}`}
                    draggable={false}
                    onClick={e => { e.stopPropagation(); onToggleChecklistItem(colId, card.id, item.id); }}
                    onMouseDown={e => e.stopPropagation()}
                    onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.stopPropagation(); e.preventDefault(); onToggleChecklistItem(colId, card.id, item.id); } }}
                    aria-pressed={item.done}
                    aria-label={item.done ? `Mark "${item.text}" not done` : `Mark "${item.text}" done`}
                    title={item.done ? 'Mark not done' : 'Mark done'}
                  >
                    {item.done && (
                      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
                        <path d="M1.5 5l2.2 2.2L8.5 2.4" stroke="white" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"/>
                      </svg>
                    )}
                  </button>
                  <span className="ck-text">{item.text || <em style={{ opacity: 0.6 }}>Untitled item</em>}</span>
                </div>
              ))}
              {ckExtra > 0 && <div className="ck-more">+{ckExtra} more</div>}
            </div>
          )}

          {ckTotal > 0 && (
            <div className={`ck-progress${ckDone === ckTotal ? ' complete' : ''}`} aria-label={`${ckDone} of ${ckTotal} done`}>
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
                <rect x="1" y="1" width="9" height="9" rx="2" stroke="currentColor" strokeWidth="1.3"/>
                {ckDone === ckTotal && <path d="M3 5.5l2 2 3.2-3.2" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>}
              </svg>
              {ckDone}/{ckTotal}
            </div>
          )}
          {card.due && (
            <div className="card-meta">
              <span className={`due-pill ${dueState}`} aria-label={`Due ${formatDueDate(card.due)}`}>
                <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
                  <rect x="1.4" y="2.2" width="8.2" height="7.2" rx="1.4" stroke="currentColor" strokeWidth="1.2"/>
                  <path d="M3.2 1.2v2M7.8 1.2v2M1.7 4.4h7.6" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
                </svg>
                {formatDueDate(card.due)}
              </span>
            </div>
          )}
        </article>
      );
    }

    /* ─── AddForm ─── */
    function CardDragGhost({ card, labels, drag }) {
      const cardLabels = (card.labels || [])
        .map(id => labels.find(l => l.id === id))
        .filter(Boolean);
      const checklist = card.checklist || [];
      const ckTotal = checklist.length;
      const ckDone = checklist.filter(i => i.done).length;

      return (
        <article
          className="card card-drag-ghost"
          style={{
            left: drag.x - drag.offsetX,
            top: drag.y - drag.offsetY,
            width: drag.width,
          }}
          aria-hidden="true"
        >
          {cardLabels.length > 0 && (
            <div className="card-labels">
              {cardLabels.map(lab => (
                <span
                  key={lab.id}
                  className="label-pill"
                  style={{ background: lab.color }}
                >{lab.name}</span>
              ))}
            </div>
          )}
          <p className="card-title">{card.title}</p>
          {card.notes && <p className="card-notes">{linkify(card.notes)}</p>}
          {ckTotal > 0 && (
            <div className={`ck-progress${ckDone === ckTotal ? ' complete' : ''}`}>
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
                <rect x="1" y="1" width="9" height="9" rx="2" stroke="currentColor" strokeWidth="1.3"/>
                {ckDone === ckTotal && <path d="M3 5.5l2 2 3.2-3.2" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>}
              </svg>
              {ckDone}/{ckTotal}
            </div>
          )}
        </article>
      );
    }

    function AddForm({ onAdd, onCancel }) {
      const [title, setTitle] = useState('');
      const [notes, setNotes] = useState('');
      const ref = useRef(null);
      useEffect(() => { ref.current?.focus(); }, []);

      const submit = () => onAdd(title, notes);

      return (
        <div className="add-form" role="form" aria-label="New card">
          <input
            ref={ref}
            className="field-input"
            placeholder="Card title"
            value={title}
            onChange={e => setTitle(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') submit(); if (e.key === 'Escape') onCancel(); }}
            aria-label="Card title"
          />
          <textarea
            className="field-input"
            placeholder="Notes (optional)"
            rows={2}
            value={notes}
            onChange={e => setNotes(e.target.value)}
            onKeyDown={e => { if (e.key === 'Escape') onCancel(); }}
            aria-label="Notes"
          />
          <div className="form-actions">
            <button className="btn-primary" onClick={submit}>Add card</button>
            <button className="btn-ghost-sm" onClick={onCancel}>Cancel</button>
          </div>
        </div>
      );
    }

    /* ─── EditModal ─── */
    function EditModal({ card, colId, columns, labels, onUpdate, onDelete, onClose }) {
      const colDef = columns.find(c => c.id === colId);
      const [title, setTitle] = useState(card.title);
      const [notes, setNotes] = useState(card.notes);
      const [notesEditing, setNotesEditing] = useState(false);
      const [attachDragOver, setAttachDragOver] = useState(false);
      const [attachmentUrls, setAttachmentUrls] = useState({});
      const [newItem, setNewItem] = useState('');
      const [ckDraggingId, setCkDraggingId] = useState(null);
      const [ckDropIdx, setCkDropIdx] = useState(null);
      const modalRef = useRef(null);
      const pointerDownStartedInsideRef = useRef(false);
      const pointerDownHadEditorRef = useRef(false);
      const titleRef = useRef(null);
      const notesRef = useRef(null);
      const newItemRef = useRef(null);
      const ckListRef = useRef(null);
      const ckDragRef = useRef(null);
      const ckDropIdxRef = useRef(null);
      const focusNewItemRef = useRef(false);
      const addingNewItemRef = useRef(false);
      const attachmentUrlRef = useRef({});

      useEffect(() => { setTitle(card.title); }, [card.id]);
      useEffect(() => { setNotes(card.notes); }, [card.id]);
      useEffect(() => { setNotesEditing(false); }, [card.id]);

      useEffect(() => {
        let cancelled = false;
        const previous = attachmentUrlRef.current;
        (async () => {
          const next = {};
          const currentIds = new Set((card.attachments || []).map(att => att.id));
          for (const att of (card.attachments || [])) {
            if (previous[att.id]) {
              next[att.id] = previous[att.id];
              continue;
            }
            if (!att.type?.startsWith('image/')) continue;
            if (!att.hasHandle) continue;
            try {
              const handle = await idbGet(`att:${att.id}`);
              const file = await handle?.getFile?.();
              if (!file || cancelled) continue;
              const url = URL.createObjectURL(file);
              next[att.id] = url;
            } catch {}
          }
          if (cancelled) {
            Object.values(next).forEach(url => URL.revokeObjectURL(url));
            return;
          }
          Object.entries(previous).forEach(([id, url]) => {
            if (!currentIds.has(id) || next[id] !== url) URL.revokeObjectURL(url);
          });
          attachmentUrlRef.current = next;
          setAttachmentUrls(next);
        })();
        return () => {
          cancelled = true;
        };
      }, [card.id, card.attachments]);

      useEffect(() => () => {
        Object.values(attachmentUrlRef.current).forEach(url => URL.revokeObjectURL(url));
        attachmentUrlRef.current = {};
      }, []);

      useEffect(() => {
        const onKey = e => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [onClose]);

      useEffect(() => {
        if (!focusNewItemRef.current) return;
        focusNewItemRef.current = false;
        newItemRef.current?.focus();
      }, [card.checklist.length]);
      useEffect(() => {
        if (notesEditing) notesRef.current?.focus();
      }, [notesEditing]);

      const persistTitle = () => {
        const t = title.trim();
        if (t && t !== card.title) onUpdate({ title: t });
        else if (!t) setTitle(card.title);
      };
      const persistNotes = () => {
        if (notes !== card.notes) onUpdate({ notes });
        setNotesEditing(false);
      };

      const addAttachmentFiles = async (entries) => {
        const added = [];
        for (const entry of entries) {
          try {
            const handle = entry.handle || null;
            const file = entry.file || await handle?.getFile?.();
            if (!file) continue;
            const id = uid('att');
            if (handle) {
              try {
                await idbSet(`att:${id}`, handle);
              } catch (err) {
                console.warn('Could not remember attachment handle', err);
              }
            }
            const url = URL.createObjectURL(file);
            attachmentUrlRef.current = { ...attachmentUrlRef.current, [id]: url };
            setAttachmentUrls(prev => ({ ...prev, [id]: url }));
            added.push({
              id,
              name: file.name || 'Attachment',
              type: file.type || '',
              size: file.size || 0,
              lastModified: file.lastModified || 0,
              hasHandle: !!handle,
            });
          } catch (err) {
            console.warn('Could not attach file', err);
          }
        }
        if (added.length) {
          onUpdate({ attachments: [...(card.attachments || []), ...added] });
        }
      };

      const handleAttachmentDrop = async (e) => {
        e.preventDefault();
        e.stopPropagation();
        setAttachDragOver(false);
        const entries = [];
        const items = Array.from(e.dataTransfer?.items || []);
        if (items.length) {
          for (const item of items) {
            if (item.kind !== 'file') continue;
            let handle = null;
            try { handle = await item.getAsFileSystemHandle?.(); } catch {}
            if (handle?.kind && handle.kind !== 'file') continue;
            entries.push({ handle, file: handle ? null : item.getAsFile() });
          }
        } else {
          entries.push(...Array.from(e.dataTransfer?.files || []).map(file => ({ file })));
        }
        addAttachmentFiles(entries);
      };

      const chooseAttachments = async () => {
        if ('showOpenFilePicker' in window) {
          try {
            const handles = await window.showOpenFilePicker({ multiple: true });
            addAttachmentFiles(handles.map(handle => ({ handle })));
            return;
          } catch (err) {
            if (err?.name === 'AbortError') return;
            console.warn('Attachment picker failed', err);
          }
        }
        alert('Drag files onto the attachment box to attach them.');
      };

      const openAttachment = async (att) => {
        try {
          let url = attachmentUrls[att.id];
          let isTempUrl = false;
          if (!url && att.hasHandle) {
            const handle = await idbGet(`att:${att.id}`);
            const file = await handle?.getFile?.();
            if (file) {
              url = URL.createObjectURL(file);
              isTempUrl = true;
            }
          }
          if (url) {
            const canPreview =
              att.type?.startsWith('image/') ||
              att.type === 'application/pdf' ||
              att.type?.startsWith('text/');
            if (canPreview) {
              const opened = window.open(url, '_blank', 'noopener');
              if (!opened) {
                const a = document.createElement('a');
                a.href = url;
                a.download = att.name || 'attachment';
                a.click();
              }
            } else {
              const a = document.createElement('a');
              a.href = url;
              a.download = att.name || 'attachment';
              document.body.appendChild(a);
              a.click();
              a.remove();
            }
            if (isTempUrl) setTimeout(() => URL.revokeObjectURL(url), 10000);
          } else {
            alert('This attachment needs to be re-added on this browser.');
          }
        } catch {
          alert('Could not open this attachment. Try re-adding it.');
        }
      };

      const removeAttachment = (att) => {
        const url = attachmentUrlRef.current[att.id];
        if (url) URL.revokeObjectURL(url);
        const nextUrls = { ...attachmentUrlRef.current };
        delete nextUrls[att.id];
        attachmentUrlRef.current = nextUrls;
        setAttachmentUrls(nextUrls);
        idbDelete(`att:${att.id}`).catch(() => {});
        onUpdate({ attachments: (card.attachments || []).filter(a => a.id !== att.id) });
      };

      const toggleLabel = (labelId) => {
        const has = (card.labels || []).includes(labelId);
        const next = has ? card.labels.filter(l => l !== labelId) : [...(card.labels || []), labelId];
        onUpdate({ labels: next });
      };

      const updateItem = (itemId, patch) => {
        onUpdate({ checklist: card.checklist.map(it => it.id === itemId ? { ...it, ...patch } : it) });
      };
      const removeItem = (itemId) => {
        onUpdate({ checklist: card.checklist.filter(it => it.id !== itemId) });
      };
      const addItem = (text, focusAfter = true) => {
        if (addingNewItemRef.current) return;
        const t = (text || '').trim();
        if (!t) return;
        addingNewItemRef.current = true;
        focusNewItemRef.current = focusAfter;
        onUpdate({ checklist: [...(card.checklist || []), { id: uid('ck'), text: t, done: false }] });
        setNewItem('');
        requestAnimationFrame(() => { addingNewItemRef.current = false; });
      };

      const moveChecklistItem = (itemId, insertIdx) => {
        const list = [...(card.checklist || [])];
        const fromIdx = list.findIndex(it => it.id === itemId);
        if (fromIdx < 0 || insertIdx === fromIdx || insertIdx === fromIdx + 1) return;
        const [moved] = list.splice(fromIdx, 1);
        const adjustedIdx = insertIdx > fromIdx ? insertIdx - 1 : insertIdx;
        list.splice(Math.max(0, adjustedIdx), 0, moved);
        onUpdate({ checklist: list });
      };

      const checklistInsertIndex = (container, clientY) => {
        const rows = Array.from(container.querySelectorAll('.ck-edit-row[data-item-id]'));
        let insertIdx = rows.length;
        for (const row of rows) {
          if (row.dataset.itemId === ckDragRef.current?.itemId) continue;
          const rect = row.getBoundingClientRect();
          const idx = +row.dataset.idx;
          if (clientY <= rect.top + rect.height / 2) {
            insertIdx = idx;
            break;
          }
        }
        return insertIdx;
      };

      const setChecklistDropIndex = (idx) => {
        ckDropIdxRef.current = idx;
        setCkDropIdx(cur => cur === idx ? cur : idx);
      };

      const onChecklistDragStart = (e, itemId, idx) => {
        ckDragRef.current = { itemId, idx };
        setCkDraggingId(itemId);
        setChecklistDropIndex(idx);
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', itemId); } catch {}
      };

      const onChecklistDragOver = (e) => {
        if (!ckDragRef.current) return;
        e.preventDefault();
        const idx = checklistInsertIndex(e.currentTarget, e.clientY);
        setChecklistDropIndex(idx);
      };

      const clearChecklistDrag = () => {
        removeChecklistPointerListeners();
        ckDragRef.current = null;
        ckDropIdxRef.current = null;
        setCkDraggingId(null);
        setCkDropIdx(null);
      };

      const onChecklistDrop = (e) => {
        e.preventDefault();
        if (ckDragRef.current && ckDropIdxRef.current !== null) {
          moveChecklistItem(ckDragRef.current.itemId, ckDropIdxRef.current);
        }
        clearChecklistDrag();
      };

      const addChecklistPointerListeners = () => {
        removeChecklistPointerListeners();
        window.addEventListener('pointermove', onChecklistWindowPointerMove, true);
        window.addEventListener('pointerup', onChecklistWindowPointerUp, true);
        window.addEventListener('pointercancel', onChecklistWindowPointerCancel, true);
        window.addEventListener('keydown', onChecklistWindowKeyDown, true);
        window.addEventListener('blur', clearChecklistDrag, true);
      };

      const removeChecklistPointerListeners = () => {
        window.removeEventListener('pointermove', onChecklistWindowPointerMove, true);
        window.removeEventListener('pointerup', onChecklistWindowPointerUp, true);
        window.removeEventListener('pointercancel', onChecklistWindowPointerCancel, true);
        window.removeEventListener('keydown', onChecklistWindowKeyDown, true);
        window.removeEventListener('blur', clearChecklistDrag, true);
      };

      const onChecklistWindowPointerMove = (e) => onChecklistPointerMove(e);
      const onChecklistWindowPointerUp = (e) => onChecklistPointerUp(e);
      const onChecklistWindowPointerCancel = () => clearChecklistDrag();
      const onChecklistWindowKeyDown = (e) => {
        if (e.key === 'Escape') clearChecklistDrag();
      };

      const onChecklistPointerDown = (e, itemId, idx) => {
        if (e.button !== 0) return;
        e.preventDefault();
        ckDragRef.current = {
          pointerId: e.pointerId,
          sourceEl: e.currentTarget,
          itemId,
          idx,
          startX: e.clientX,
          startY: e.clientY,
          dragging: false,
        };
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
        addChecklistPointerListeners();
      };

      const onChecklistPointerMove = (e) => {
        const d = ckDragRef.current;
        if (!d || d.pointerId !== e.pointerId) return false;
        if (d.dragging && e.buttons === 0) {
          clearChecklistDrag();
          return false;
        }

        const dx = e.clientX - d.startX;
        const dy = e.clientY - d.startY;
        if (!d.dragging && Math.hypot(dx, dy) < 4) return false;

        e.preventDefault();
        if (!d.dragging) {
          d.dragging = true;
          setCkDraggingId(d.itemId);
          setChecklistDropIndex(d.idx);
        }

        if (ckListRef.current) {
          const idx = checklistInsertIndex(ckListRef.current, e.clientY);
          setChecklistDropIndex(idx);
        }
        return true;
      };

      const onChecklistPointerUp = (e) => {
        const d = ckDragRef.current;
        if (!d || d.pointerId !== e.pointerId) return false;
        try { d.sourceEl?.releasePointerCapture(e.pointerId); } catch {}
        if (d.dragging && ckDropIdxRef.current !== null) {
          e.preventDefault();
          moveChecklistItem(d.itemId, ckDropIdxRef.current);
        }
        clearChecklistDrag();
        return !!d.dragging;
      };

      const ckTotal = card.checklist.length;
      const ckDone  = card.checklist.filter(i => i.done).length;

      const isEditableEl = (el) =>
        el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);

      const hasActiveTextSelection = () => {
        const active = document.activeElement;
        if (isEditableEl(active) && typeof active.selectionStart === 'number') {
          return active.selectionStart !== active.selectionEnd;
        }
        const selection = window.getSelection?.();
        return !!selection && !selection.isCollapsed;
      };

      const blurActiveEditor = () => {
        const active = document.activeElement;
        if (isEditableEl(active)) active.blur();
        window.getSelection?.().removeAllRanges();
      };

      const handleOverlayMouseDown = (e) => {
        const active = document.activeElement;
        pointerDownStartedInsideRef.current = e.target !== e.currentTarget;
        pointerDownHadEditorRef.current =
          e.target === e.currentTarget &&
          modalRef.current?.contains(active) &&
          isEditableEl(active);
      };

      const handleOverlayClick = (e) => {
        if (e.target !== e.currentTarget) return;
        const active = document.activeElement;
        const activeEditorInModal = modalRef.current?.contains(active) && isEditableEl(active);
        if (pointerDownStartedInsideRef.current) {
          pointerDownStartedInsideRef.current = false;
          pointerDownHadEditorRef.current = false;
          return;
        }
        if (pointerDownHadEditorRef.current || activeEditorInModal || hasActiveTextSelection()) {
          pointerDownStartedInsideRef.current = false;
          pointerDownHadEditorRef.current = false;
          blurActiveEditor();
          return;
        }
        pointerDownHadEditorRef.current = false;
        onClose();
      };

      return (
        <div className="overlay" role="dialog" aria-modal="true" aria-label="Edit card" onMouseDown={handleOverlayMouseDown} onClick={handleOverlayClick}>
          <div className="modal" ref={modalRef}>
            <div className="modal-hd">
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <h2 className="modal-hd-title">Edit card</h2>
                <span className="col-pill" style={{ background: colDef.color }}>{colDef.label}</span>
              </div>
              <button className="modal-close" onClick={onClose} aria-label="Close dialog">✕</button>
            </div>

            <div>
              <label className="field-label" htmlFor="m-title">Title</label>
              <div className="field-row">
                <button
                  type="button"
                  className={`ck-box${card.complete ? ' done' : ''}`}
                  onClick={() => onUpdate({ complete: !card.complete })}
                  aria-pressed={!!card.complete}
                  aria-label={card.complete ? 'Mark card incomplete' : 'Mark card complete'}
                  title={card.complete ? 'Mark incomplete' : 'Mark complete'}
                >
                  {card.complete && (
                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
                      <path d="M1.5 5l2.2 2.2L8.5 2.4" stroke="white" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  )}
                </button>
                <input
                  id="m-title"
                  ref={titleRef}
                  className="field-input"
                  value={title}
                  onChange={e => setTitle(e.target.value)}
                  onBlur={persistTitle}
                  onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); persistTitle(); } }}
                  aria-required="true"
                />
              </div>
            </div>

            <div>
              <label className="field-label" htmlFor="m-due">Deadline</label>
              <div className="due-field-row">
                <input
                  id="m-due"
                  type="date"
                  className="field-input"
                  value={card.due || ''}
                  onChange={e => onUpdate({ due: e.target.value })}
                  aria-label="Deadline date"
                />
                {card.due && (
                  <>
                    <span className={`due-pill ${dueStatus(card)}`}>
                      {formatDueDate(card.due)}
                    </span>
                    <button
                      type="button"
                      className="btn-ghost-sm"
                      onClick={() => onUpdate({ due: '' })}
                    >Clear</button>
                  </>
                )}
              </div>
            </div>

            <div>
              <label className="field-label">Labels</label>
              <div className="label-pills">
                {labels.map(lab => {
                  const on = (card.labels || []).includes(lab.id);
                  return (
                    <button
                      key={lab.id}
                      type="button"
                      className={`label-pill btn${on ? '' : ' off'}`}
                      style={{ background: lab.color }}
                      onClick={() => toggleLabel(lab.id)}
                      aria-pressed={on}
                    >{lab.name}</button>
                  );
                })}
              </div>
            </div>

            <div>
              <label className="field-label" htmlFor="m-notes">
                Notes <span style={{ textTransform: 'none', letterSpacing: 0, fontWeight: 400, color: 'var(--text-3)' }}>· links auto-detected</span>
              </label>
              {!notesEditing && (
                <div
                  id="m-notes"
                  className={`notes-preview${notes ? '' : ' empty'}`}
                  tabIndex={0}
                  onClick={() => setNotesEditing(true)}
                  onKeyDown={e => {
                    if (e.key === 'Enter' || e.key === ' ') {
                      e.preventDefault();
                      setNotesEditing(true);
                    }
                  }}
                  aria-label="Notes"
                  title="Click to edit notes"
                >
                  {notes ? formatNotes(notes) : 'Add notes...'}
                </div>
              )}
              {notesEditing && (
              <textarea
                id="m-notes"
                ref={notesRef}
                className="field-input notes-input"
                rows={5}
                placeholder="Add notes…"
                value={notes}
                onChange={e => setNotes(e.target.value)}
                onBlur={persistNotes}
                onKeyDown={e => {
                  if (e.key === 'Escape') {
                    e.preventDefault();
                    setNotes(card.notes);
                    setNotesEditing(false);
                  }
                }}
                style={{ resize: 'vertical' }}
              />
              )}
            </div>

            <div>
              <label className="field-label">
                Attachments <span style={{ textTransform: 'none', letterSpacing: 0, fontWeight: 400, color: 'var(--text-3)' }}>local to this browser</span>
              </label>
              <div className="attachments">
                <div
                  className={`attach-drop${attachDragOver ? ' drag-over' : ''}`}
                  onDragEnter={e => { e.preventDefault(); setAttachDragOver(true); }}
                  onDragOver={e => { e.preventDefault(); setAttachDragOver(true); }}
                  onDragLeave={e => { if (e.currentTarget === e.target) setAttachDragOver(false); }}
                  onDrop={handleAttachmentDrop}
                >
                  Drop files here or <button type="button" className="attachment-action" onClick={chooseAttachments}>choose files</button>
                </div>
                {(card.attachments || []).length > 0 && (
                  <div className="attachment-list">
                    {(card.attachments || []).map(att => (
                      <div className="attachment-row" key={att.id}>
                        <div className="attachment-thumb" aria-hidden="true">
                          {att.type?.startsWith('image/') && attachmentUrls[att.id] ? (
                            <img src={attachmentUrls[att.id]} alt="" />
                          ) : (
                            <span>{att.type?.startsWith('text/') ? 'TXT' : 'FILE'}</span>
                          )}
                        </div>
                        <div style={{ minWidth: 0 }}>
                          <div className="attachment-name" title={att.name}>{att.name}</div>
                          <div className="attachment-meta">
                            {[att.type || 'file', formatBytes(att.size), att.hasHandle ? 'linked' : 'session only'].filter(Boolean).join(' / ')}
                          </div>
                        </div>
                        <button type="button" className="attachment-action" onClick={() => openAttachment(att)}>Open</button>
                        <button type="button" className="attachment-action danger" onClick={() => removeAttachment(att)} aria-label={`Remove ${att.name}`}>Remove</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <div>
              <label className="field-label">
                Checklist {ckTotal > 0 && <span style={{ textTransform: 'none', letterSpacing: 0, fontWeight: 400, color: 'var(--text-3)' }}>· {ckDone}/{ckTotal} done</span>}
              </label>
              <div
                className="ck-edit"
                ref={ckListRef}
              >
                {card.checklist.map((item, idx) => (
                  <ChecklistEditRow
                    key={item.id}
                    item={item}
                    idx={idx}
                    isDragging={ckDraggingId === item.id}
                    dropBefore={ckDraggingId && ckDraggingId !== item.id && ckDropIdx === idx}
                    dropAfter={ckDraggingId && ckDropIdx === card.checklist.length && idx === card.checklist.length - 1}
                    onPointerDown={(e) => onChecklistPointerDown(e, item.id, idx)}
                    onToggle={() => updateItem(item.id, { done: !item.done })}
                    onText={(text) => updateItem(item.id, { text })}
                    onRemove={() => removeItem(item.id)}
                  />
                ))}
                <div className="ck-edit-row">
                  <span
                    className="ck-drag-handle"
                    style={{ visibility: 'hidden' }}
                    aria-hidden="true"
                  ></span>
                  <button
                    type="button"
                    className="ck-box"
                    style={{ visibility: 'hidden' }}
                    aria-hidden="true"
                    tabIndex={-1}
                  ></button>
                  <input
                    ref={newItemRef}
                    className="field-input"
                    placeholder="Add an item — Enter to save"
                    value={newItem}
                    onChange={e => setNewItem(e.target.value)}
                    onBlur={e => addItem(newItem, e.relatedTarget?.classList?.contains('ck-add'))}
                    onKeyDown={e => {
                      if (e.key === 'Enter') { e.preventDefault(); addItem(newItem); }
                      if (e.key === 'Escape') setNewItem('');
                    }}
                    aria-label="New checklist item"
                  />
                  <button
                    type="button"
                    className="ck-add"
                    onClick={() => addItem(newItem)}
                    disabled={!newItem.trim()}
                    style={!newItem.trim() ? { opacity: 0.5, cursor: 'not-allowed' } : {}}
                  >Add</button>
                </div>
              </div>
            </div>

            <div className="modal-footer">
              <button
                className="btn-danger"
                onClick={() => { if (window.confirm('Delete this card?')) onDelete(); }}
              >Delete</button>
              <div className="modal-footer-right">
                <button className="btn-primary" onClick={onClose}>Done</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ─── ChecklistEditRow ─── */
    function ChecklistEditRow({ item, idx, isDragging, dropBefore, dropAfter, onPointerDown, onToggle, onText, onRemove }) {
      const [text, setText] = useState(item.text);
      useEffect(() => { setText(item.text); }, [item.id, item.text]);

      const persist = () => { if (text !== item.text) onText(text); };
      const rowClass = [
        'ck-edit-row',
        isDragging ? 'dragging' : '',
        dropBefore ? 'drop-before' : '',
        dropAfter ? 'drop-after' : '',
      ].filter(Boolean).join(' ');

      return (
        <div className={rowClass} data-item-id={item.id} data-idx={idx}>
          <button
            type="button"
            className="ck-drag-handle"
            onPointerDown={onPointerDown}
            aria-label="Drag checklist item"
            title="Drag to reorder"
          >
            <svg width="12" height="16" viewBox="0 0 12 16" fill="none" aria-hidden="true">
              <circle cx="4" cy="4" r="1.2" fill="currentColor"/>
              <circle cx="8" cy="4" r="1.2" fill="currentColor"/>
              <circle cx="4" cy="8" r="1.2" fill="currentColor"/>
              <circle cx="8" cy="8" r="1.2" fill="currentColor"/>
              <circle cx="4" cy="12" r="1.2" fill="currentColor"/>
              <circle cx="8" cy="12" r="1.2" fill="currentColor"/>
            </svg>
          </button>
          <button
            type="button"
            className={`ck-box${item.done ? ' done' : ''}`}
            onClick={onToggle}
            aria-pressed={item.done}
            aria-label={item.done ? 'Mark not done' : 'Mark done'}
          >
            {item.done && (
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
                <path d="M1.5 5l2.2 2.2L8.5 2.4" stroke="white" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            )}
          </button>
          <input
            className={`field-input${item.done ? ' done' : ''}`}
            value={text}
            onChange={e => setText(e.target.value)}
            onBlur={persist}
            onKeyDown={e => {
              if (e.key === 'Enter') { e.preventDefault(); persist(); e.target.blur(); }
            }}
            aria-label="Checklist item"
          />
          <button
            type="button"
            className="ck-remove"
            onClick={onRemove}
            aria-label="Remove item"
            title="Remove"
          >✕</button>
        </div>
      );
    }

    /* ─── LabelManager ─── */
    function LabelManager({ labels, onSave, onClose }) {
      const [draft, setDraft] = useState(labels);
      const [draggingId, setDraggingId] = useState(null);
      const [dropIdx, setDropIdx] = useState(null);
      const listRef = useRef(null);
      const dragRef = useRef(null);
      const dropIdxRef = useRef(null);

      // sync from external changes (e.g., card label removal cleanup)
      useEffect(() => { setDraft(labels); }, [labels]);

      const change = (id, patch) => {
        const next = draft.map(l => l.id === id ? { ...l, ...patch } : l);
        setDraft(next);
        onSave(next);
      };

      const remove = (id) => {
        const lab = draft.find(l => l.id === id);
        if (!lab) return;
        if (!window.confirm(`Remove "${lab.name}"? It will be removed from every card.`)) return;
        const next = draft.filter(l => l.id !== id);
        setDraft(next);
        onSave(next);
      };

      const add = () => {
        const next = [...draft, { id: uid('lab'), name: 'New label', color: '#888888' }];
        setDraft(next);
        onSave(next);
      };

      const moveLabel = (labelId, insertIdx) => {
        const list = [...draft];
        const fromIdx = list.findIndex(l => l.id === labelId);
        if (fromIdx < 0 || insertIdx === fromIdx || insertIdx === fromIdx + 1) return;
        const [moved] = list.splice(fromIdx, 1);
        const adjustedIdx = insertIdx > fromIdx ? insertIdx - 1 : insertIdx;
        list.splice(Math.max(0, adjustedIdx), 0, moved);
        setDraft(list);
        onSave(list);
      };

      const labelInsertIndex = (container, clientY) => {
        const rows = Array.from(container.querySelectorAll('.lab-mgr-row[data-label-id]'));
        let insertIdx = rows.length;
        for (const row of rows) {
          if (row.dataset.labelId === dragRef.current?.labelId) continue;
          const rect = row.getBoundingClientRect();
          const idx = +row.dataset.idx;
          if (clientY <= rect.top + rect.height / 2) {
            insertIdx = idx;
            break;
          }
        }
        return insertIdx;
      };

      const setLabelDropIndex = (idx) => {
        dropIdxRef.current = idx;
        setDropIdx(cur => cur === idx ? cur : idx);
      };

      const clearLabelDrag = () => {
        removeLabelPointerListeners();
        dragRef.current = null;
        dropIdxRef.current = null;
        setDraggingId(null);
        setDropIdx(null);
      };

      const addLabelPointerListeners = () => {
        removeLabelPointerListeners();
        window.addEventListener('pointermove', onLabelWindowPointerMove, true);
        window.addEventListener('pointerup', onLabelWindowPointerUp, true);
        window.addEventListener('pointercancel', onLabelWindowPointerCancel, true);
        window.addEventListener('keydown', onLabelWindowKeyDown, true);
        window.addEventListener('blur', clearLabelDrag, true);
      };

      const removeLabelPointerListeners = () => {
        window.removeEventListener('pointermove', onLabelWindowPointerMove, true);
        window.removeEventListener('pointerup', onLabelWindowPointerUp, true);
        window.removeEventListener('pointercancel', onLabelWindowPointerCancel, true);
        window.removeEventListener('keydown', onLabelWindowKeyDown, true);
        window.removeEventListener('blur', clearLabelDrag, true);
      };

      const onLabelWindowPointerMove = (e) => onLabelPointerMove(e);
      const onLabelWindowPointerUp = (e) => onLabelPointerUp(e);
      const onLabelWindowPointerCancel = () => clearLabelDrag();
      const onLabelWindowKeyDown = (e) => {
        if (e.key === 'Escape') clearLabelDrag();
      };

      const onLabelPointerDown = (e, labelId, idx) => {
        if (e.button !== 0) return;
        e.preventDefault();
        dragRef.current = {
          pointerId: e.pointerId,
          sourceEl: e.currentTarget,
          labelId,
          idx,
          startX: e.clientX,
          startY: e.clientY,
          dragging: false,
        };
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
        addLabelPointerListeners();
      };

      const onLabelPointerMove = (e) => {
        const d = dragRef.current;
        if (!d || d.pointerId !== e.pointerId) return false;
        if (d.dragging && e.buttons === 0) {
          clearLabelDrag();
          return false;
        }

        const dx = e.clientX - d.startX;
        const dy = e.clientY - d.startY;
        if (!d.dragging && Math.hypot(dx, dy) < 4) return false;

        e.preventDefault();
        if (!d.dragging) {
          d.dragging = true;
          setDraggingId(d.labelId);
          setLabelDropIndex(d.idx);
        }

        if (listRef.current) {
          const idx = labelInsertIndex(listRef.current, e.clientY);
          setLabelDropIndex(idx);
        }
        return true;
      };

      const onLabelPointerUp = (e) => {
        const d = dragRef.current;
        if (!d || d.pointerId !== e.pointerId) return false;
        try { d.sourceEl?.releasePointerCapture(e.pointerId); } catch {}
        if (d.dragging && dropIdxRef.current !== null) {
          e.preventDefault();
          moveLabel(d.labelId, dropIdxRef.current);
        }
        clearLabelDrag();
        return !!d.dragging;
      };

      useEffect(() => () => removeLabelPointerListeners(), []);

      return (
        <div className="overlay" role="dialog" aria-modal="true" aria-label="Manage labels" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="modal" style={{ width: 600 }}>
            <div className="modal-hd">
              <h2 className="modal-hd-title">Manage labels</h2>
              <button className="modal-close" onClick={onClose} aria-label="Close dialog">✕</button>
            </div>

            <div className="lab-mgr-list" ref={listRef}>
              {draft.map((l, idx) => (
                <LabelManagerRow
                  key={l.id}
                  label={l}
                  idx={idx}
                  isDragging={draggingId === l.id}
                  dropBefore={draggingId && draggingId !== l.id && dropIdx === idx}
                  dropAfter={draggingId && dropIdx === draft.length && idx === draft.length - 1}
                  onPointerDown={(e) => onLabelPointerDown(e, l.id, idx)}
                  onChange={(patch) => change(l.id, patch)}
                  onRemove={() => remove(l.id)}
                />
              ))}
            </div>

            <button className="ck-add" onClick={add}>
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
                <path d="M5.5 1v9M1 5.5h9" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/>
              </svg>
              Add label
            </button>

            <div className="modal-footer" style={{ justifyContent: 'flex-end' }}>
              <button className="btn-primary" onClick={onClose}>Done</button>
            </div>
          </div>
        </div>
      );
    }

    /* ─── LabelManagerRow ─── */
    function LabelManagerRow({ label, idx, isDragging, dropBefore, dropAfter, onPointerDown, onChange, onRemove }) {
      const [hex, setHex] = useState(() => colorToHex(label.color));
      const [hexValid, setHexValid] = useState(true);

      useEffect(() => { setHex(colorToHex(label.color)); setHexValid(true); }, [label.id, label.color]);

      const onPicker = (e) => {
        const v = e.target.value.toLowerCase();
        setHex(v);
        setHexValid(true);
        onChange({ color: v });
      };

      const onHexInput = (e) => {
        let v = e.target.value;
        if (v && !v.startsWith('#')) v = '#' + v;
        setHex(v);
        if (HEX_RE.test(v)) {
          setHexValid(true);
          onChange({ color: v.toLowerCase() });
        } else {
          setHexValid(false);
        }
      };

      const onName = (e) => onChange({ name: e.target.value });

      const rowClass = [
        'lab-mgr-row',
        isDragging ? 'dragging' : '',
        dropBefore ? 'drop-before' : '',
        dropAfter ? 'drop-after' : '',
      ].filter(Boolean).join(' ');

      return (
        <div className={rowClass} data-label-id={label.id} data-idx={idx}>
          <button
            type="button"
            className="ck-drag-handle"
            onPointerDown={onPointerDown}
            aria-label={`Drag label ${label.name}`}
            title="Drag to reorder"
          >
            <svg width="12" height="18" viewBox="0 0 12 18" aria-hidden="true">
              <circle cx="3" cy="4" r="1.35" fill="currentColor"/>
              <circle cx="9" cy="4" r="1.35" fill="currentColor"/>
              <circle cx="3" cy="9" r="1.35" fill="currentColor"/>
              <circle cx="9" cy="9" r="1.35" fill="currentColor"/>
              <circle cx="3" cy="14" r="1.35" fill="currentColor"/>
              <circle cx="9" cy="14" r="1.35" fill="currentColor"/>
            </svg>
          </button>
          <input
            type="color"
            className="lab-mgr-color"
            value={HEX_RE.test(hex) ? hex : '#888888'}
            onChange={onPicker}
            aria-label={`Color for ${label.name}`}
            title="Pick color"
          />
          <input
            className={`field-input lab-mgr-hex${hexValid ? '' : ' invalid'}`}
            value={hex}
            onChange={onHexInput}
            placeholder="#RRGGBB"
            spellCheck={false}
            aria-label="Hex color"
          />
          <input
            className="field-input lab-mgr-name"
            value={label.name}
            onChange={onName}
            placeholder="Label name"
            aria-label="Label name"
          />
          <span
            className="label-pill"
            style={{ background: HEX_RE.test(hex) ? hex : label.color, padding: '4px 11px', fontSize: '11.5px' }}
          >{label.name || ' '}</span>
          <button
            type="button"
            className="ck-remove"
            onClick={onRemove}
            aria-label={`Remove label ${label.name}`}
            title="Remove label"
          >✕</button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
