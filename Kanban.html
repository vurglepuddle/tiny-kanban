<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban</title>
  <link rel="icon" href="icon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         oklch(0.96 0.010 72);
      --col-bg:     oklch(0.925 0.009 72);
      --col-drop:   oklch(0.91 0.035 245);
      --card-bg:    oklch(0.995 0.003 72);
      --text:       oklch(0.19 0.015 72);
      --text-2:     oklch(0.52 0.010 72);
      --text-3:     oklch(0.70 0.008 72);
      --border:     oklch(0.875 0.008 72);
      --border-2:   oklch(0.92 0.005 72);
      --accent:     oklch(0.56 0.14 245);
      --accent-h:   oklch(0.50 0.14 245);
      --accent-bg:  oklch(0.95 0.040 245);
      --danger:     oklch(0.55 0.18 20);
      --danger-bg:  oklch(0.96 0.04 20);
      --green:      oklch(0.62 0.16 150);
      --r-card:     10px;
      --r-col:      14px;
      --font:       'DM Sans', system-ui, sans-serif;
      color-scheme: light;
    }

    .dark {
      --bg:         oklch(0.17 0.018 65);
      --col-bg:     oklch(0.21 0.016 65);
      --col-drop:   oklch(0.23 0.045 245);
      --card-bg:    oklch(0.245 0.014 65);
      --text:       oklch(0.88 0.012 78);
      --text-2:     oklch(0.64 0.010 78);
      --text-3:     oklch(0.48 0.008 78);
      --border:     oklch(0.29 0.015 65);
      --border-2:   oklch(0.26 0.012 65);
      --accent:     oklch(0.66 0.13 245);
      --accent-h:   oklch(0.72 0.13 245);
      --accent-bg:  oklch(0.25 0.050 245);
      --danger:     oklch(0.68 0.16 20);
      --danger-bg:  oklch(0.23 0.050 20);
      --green:      oklch(0.68 0.16 150);
      color-scheme: dark;
    }

    html, body, #root {
      height: 100%;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    #root {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .topbar, .column, .card, .modal, .overlay,
    .add-btn, .field-input, .tbtn, .icon-btn,
    .col-count, .col-sort-due, .modal-close, .btn-ghost-sm,
    .drop-placeholder, .save-badge-dot {
      transition: background-color 0.35s ease, color 0.35s ease,
                  border-color 0.35s ease, box-shadow 0.35s ease;
    }

    /* ── Top bar ── */
    .topbar {
      min-height: 54px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 14px;
      flex-shrink: 0;
      z-index: 10;
      flex-wrap: wrap;
      padding-top: 8px;
      padding-bottom: 8px;
    }
    .topbar-logo {
      min-width: 42px;
      max-width: min(280px, 42vw);
      height: 30px;
      padding: 0 2px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.4px;
      color: var(--text);
      font-family: inherit;
      text-align: left;
      cursor: text;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar-logo:hover {
      background: var(--card-bg);
      border-color: var(--border-2);
    }
    .topbar-logo:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      background: var(--card-bg);
      border-color: var(--accent);
    }
    .topbar-pip {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      opacity: 0.7;
    }
    .topbar-spacer { flex: 1; }
    .kbd-hint {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      color: var(--text-3);
    }
    .kbd {
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      font-size: 10.5px;
      padding: 1px 6px;
      border: 1px solid var(--border);
      border-bottom-width: 1.5px;
      border-radius: 4px;
      background: var(--col-bg);
      color: var(--text-2);
      line-height: 1.4;
    }
    .save-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--text-3);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .save-badge.show { opacity: 1; }
    .save-badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
    }
    .backup-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-3);
      min-width: 86px;
    }
    .backup-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-3);
      opacity: 0.7;
    }
    .backup-status.linked .backup-dot,
    .backup-status.saved .backup-dot { background: var(--green); opacity: 1; }
    .backup-status.saving .backup-dot { background: var(--accent); opacity: 1; }
    .backup-status.error .backup-dot { background: var(--danger); opacity: 1; }
    .backup-wrap {
      position: relative;
    }
    .backup-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 220px;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-bg);
      box-shadow: 0 14px 42px oklch(0.18 0 0 / 0.18), 0 2px 8px oklch(0.18 0 0 / 0.08);
      z-index: 30;
      animation: fadeIn 0.12s ease;
    }
    .backup-menu-item {
      width: 100%;
      min-height: 34px;
      padding: 0 10px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--text-2);
      font: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .backup-menu-item:hover {
      background: var(--col-bg);
      color: var(--text);
    }
    .backup-menu-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .backup-menu-item svg {
      opacity: 0.75;
      flex-shrink: 0;
    }
    .backup-menu-item.danger {
      color: var(--danger);
    }
    .backup-menu-item.danger:hover {
      background: var(--danger-bg);
      color: var(--danger);
    }
    .backup-menu-sep {
      height: 1px;
      margin: 7px 3px;
      background: var(--border-2);
    }
    .backup-menu-status {
      margin: 7px 3px 2px;
      padding-top: 8px;
      border-top: 1px solid var(--border-2);
      max-width: 100%;
    }
    .backup-menu-status span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tbtn {
      height: 34px;
      padding: 0 14px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .tbtn:hover { background: var(--card-bg); color: var(--text); border-color: oklch(0.80 0.008 72); }
    .tbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tbtn svg { opacity: 0.7; }
    .tbtn.backup-attention {
      color: var(--danger);
      border-color: var(--danger);
      background: var(--danger-bg);
    }
    .tbtn.backup-attention svg { opacity: 0.95; }
    .tbtn.backup-ok {
      border-color: var(--green);
    }
    .backup-alert {
      margin-left: 2px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }

    /* ── Filter strip ── */
    .filter-strip {
      display: flex;
      align-items: center;
      column-gap: 12px;
      row-gap: 7px;
      flex-wrap: wrap;
    }
    .filter-strip-label {
      margin-right: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-3);
    }
    .filter-clear {
      font: inherit;
      font-size: 12px;
      color: var(--text-2);
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px 7px;
      border-radius: 5px;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .filter-clear:hover { color: var(--text); }

    /* ── Board ── */
    .board {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 18px;
      padding: 22px 22px 22px;
      overflow-x: auto;
      overflow-y: hidden;
      align-items: flex-start;
    }
    .board::-webkit-scrollbar { height: 5px; }
    .board::-webkit-scrollbar-track { background: transparent; }
    .board::-webkit-scrollbar-thumb { background: oklch(0.82 0.008 72); border-radius: 3px; }

    /* ── Column ── */
    .column {
      width: 276px;
      flex-shrink: 0;
      border-radius: var(--r-col);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 54px - 44px);
      background: var(--col-bg);
      transition: background 0.2s ease, opacity 0.18s ease, transform 0.18s ease;
      position: relative;
    }
    .column.drop-active { background: var(--col-drop); }
    .column.col-dragging { opacity: 0.45; transform: scale(0.985); }
    .column.col-drop-before::before,
    .column.col-drop-after::after {
      content: '';
      position: absolute;
      top: 6px;
      bottom: 6px;
      width: 3px;
      background: var(--accent);
      border-radius: 3px;
    }
    .column.col-drop-before::before { left: -10px; }
    .column.col-drop-after::after  { right: -10px; }

    .col-header {
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
      cursor: grab;
    }
    .col-header:active { cursor: grabbing; }
    .col-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      border: none;
      padding: 0;
      cursor: pointer;
      box-shadow: 0 0 0 2px transparent;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .col-dot:hover {
      transform: scale(1.25);
      box-shadow: 0 0 0 3px var(--border-2);
    }
    .col-dot:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--card-bg), 0 0 0 4px var(--accent);
    }
    .col-color-wrap {
      position: relative;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .col-color-menu {
      position: absolute;
      top: 18px;
      left: -8px;
      z-index: 35;
      display: grid;
      grid-template-columns: repeat(4, 22px);
      gap: 6px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-bg);
      box-shadow: 0 12px 34px oklch(0.18 0 0 / 0.16), 0 2px 8px oklch(0.18 0 0 / 0.08);
      animation: fadeIn 0.12s ease;
    }
    .col-color-swatch {
      width: 22px;
      height: 22px;
      border: 2px solid transparent;
      border-radius: 50%;
      cursor: pointer;
      padding: 0;
    }
    .col-color-swatch.active {
      border-color: var(--text);
      box-shadow: 0 0 0 2px var(--card-bg);
    }
    .col-color-swatch:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .col-title {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.15px;
      color: var(--text);
      flex: 1;
      cursor: text;
      padding: 2px 4px;
      margin: -2px -4px;
      border-radius: 5px;
      transition: background 0.12s;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .col-title:hover { background: oklch(0.88 0.007 72 / 0.6); }
    .dark .col-title:hover { background: oklch(0.27 0.014 65); }
    .col-rename-input {
      flex: 1;
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.15px;
      color: var(--text);
      border: 1.5px solid var(--accent);
      border-radius: 6px;
      padding: 2px 6px;
      background: var(--card-bg);
      outline: none;
      width: 100%;
      min-width: 0;
    }
    .col-count {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-3);
      background: oklch(0.88 0.007 72);
      border-radius: 20px;
      padding: 2px 8px;
      min-width: 22px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .dark .col-count { background: oklch(0.27 0.013 65); }
    .col-sort-due {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      border-radius: 6px;
      color: var(--text-3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.72;
      flex-shrink: 0;
      transition: opacity 0.13s, background 0.12s, color 0.12s;
    }
    .column:hover .col-sort-due { opacity: 1; }
    .col-sort-due:hover {
      background: var(--accent-bg);
      color: var(--accent);
    }
    .col-sort-due:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      opacity: 1;
    }
    .col-delete {
      width: 24px; height: 24px;
      border: none;
      background: transparent;
      border-radius: 6px;
      color: var(--text-3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.13s, background 0.12s, color 0.12s;
      flex-shrink: 0;
    }
    .column:hover .col-delete { opacity: 0.85; }
    .col-delete:hover { background: var(--danger-bg); color: var(--danger); opacity: 1; }
    .col-delete:focus-visible { outline: 2px solid var(--danger); outline-offset: 1px; opacity: 1; }

    /* ── Add column tile ── */
    .col-add-btn {
      flex-shrink: 0;
      align-self: flex-start;
      width: 220px;
      padding: 12px 16px;
      background: none;
      border: 1.5px dashed var(--border);
      border-radius: var(--r-col);
      color: var(--text-3);
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.13s, color 0.13s, border-color 0.13s;
    }
    .col-add-btn:hover { background: var(--col-bg); color: var(--text-2); border-color: var(--text-3); }
    .col-add-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Cards area ── */
    .cards-area {
      flex: 1;
      overflow-y: auto;
      padding: 2px 10px 4px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-height: 48px;
    }
    .cards-area::-webkit-scrollbar { width: 3px; }
    .cards-area::-webkit-scrollbar-track { background: transparent; }
    .cards-area::-webkit-scrollbar-thumb { background: oklch(0.83 0.007 72); border-radius: 3px; }

    /* ── Drop placeholder ── */
    .drop-placeholder {
      flex-shrink: 0;
      height: 66px;
      border: 2px dashed oklch(0.72 0.09 245);
      border-radius: var(--r-card);
      background: oklch(0.94 0.040 245);
      transition: all 0.15s ease;
      animation: placeholderIn 0.14s ease;
    }
    @keyframes placeholderIn {
      from { opacity: 0; transform: scaleY(0.6); }
      to   { opacity: 1; transform: scaleY(1); }
    }

    /* ── Card ── */
    .card {
      flex-shrink: 0;
      background: var(--card-bg);
      border-radius: var(--r-card);
      padding: 13px 15px;
      box-shadow: 0 1px 2px oklch(0.2 0 0 / 0.06), 0 1px 5px oklch(0.2 0 0 / 0.04);
      border: 1px solid oklch(0.91 0.004 72);
      cursor: pointer;
      position: relative;
      transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
      user-select: none;
      touch-action: none;
    }
    .dark .card { border-color: oklch(0.28 0.013 65); }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px oklch(0.2 0 0 / 0.10), 0 1px 4px oklch(0.2 0 0 / 0.06);
    }
    .card.is-dragging {
      opacity: 0.32;
    }
    .card.is-dragging:hover {
      transform: none;
    }
    .card-drag-ghost {
      position: fixed;
      z-index: 1000;
      pointer-events: none;
      opacity: 0.96;
      transform: rotate(2.5deg) scale(1.04);
      box-shadow: 0 12px 36px oklch(0.2 0 0 / 0.22);
      cursor: grabbing;
    }
    body.card-pointer-dragging {
      cursor: grabbing;
      user-select: none;
    }
    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .card-labels {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 7px;
    }
    .card-title {
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.48;
      color: var(--text);
      text-wrap: pretty;
    }
    .card-title-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .card-title-row .card-title {
      flex: 1;
      min-width: 0;
    }
    .card-title-row .ck-box {
      margin-top: 2px;
    }
    .card-notes {
      font-size: 12px;
      color: var(--text-2);
      margin-top: 5px;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .card a, .modal a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .card a:hover, .modal a:hover { color: var(--accent-h); }
    .card-meta {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .due-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      width: fit-content;
      padding: 2px 7px 2px 5px;
      border-radius: 5px;
      background: oklch(0.92 0.005 72);
      color: var(--text-3);
      font-size: 11px;
      font-weight: 500;
    }
    .dark .due-pill { background: oklch(0.27 0.013 65); }
    .due-pill.overdue { color: var(--danger); background: var(--danger-bg); }
    .due-pill.today { color: oklch(0.50 0.13 70); background: oklch(0.94 0.06 85); }
    .dark .due-pill.today { color: oklch(0.78 0.13 85); background: oklch(0.28 0.04 85); }
    .due-pill.complete { color: var(--green); background: oklch(0.93 0.05 150); }
    .dark .due-pill.complete { background: oklch(0.27 0.04 150); }
    .icon-btn {
      width: 28px; height: 28px;
      border: none;
      background: oklch(0.91 0.007 72);
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      transition: background 0.12s, color 0.12s;
    }
    .dark .icon-btn { background: oklch(0.28 0.013 65); }
    .icon-btn:hover { background: oklch(0.86 0.009 72); color: var(--text); }
    .dark .icon-btn:hover { background: oklch(0.32 0.014 65); }
    .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* ── Labels (pills) ── */
    .label-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      padding: 2px 8px;
      border-radius: 20px;
      color: white;

    const { useState, useEffect, useLayoutEffect, useRef, useCallback, useMemo } = React;

    const STORAGE = 'kb-v2';

    const URL_RE  = /((?:https?|file):\/\/[^\s<>"']+)/g;
    const HEX_RE  = /^#[0-9A-Fa-f]{6}$/;

    let _id = 0;
    const uid = (p='c') => `${p}_${Date.now().toString(36)}_${(++_id).toString(36)}_${Math.random().toString(36).slice(2,6)}`;

    /* ─── Color → hex (canvas trick — accepts oklch, rgb, hex, names) ─── */
    let _hexCtx = null;
    const clamp01 = (n) => Math.min(1, Math.max(0, n));
    const byteToHex = (n) => Math.round(clamp01(n) * 255).toString(16).padStart(2, '0');
    const srgbTransfer = (n) => n <= 0.0031308 ? 12.92 * n : 1.055 * Math.pow(n, 1 / 2.4) - 0.055;

    function oklchToHex(c) {
      const m = String(c).trim().match(/^oklch\(\s*([0-9.]+%?)\s+([0-9.]+)\s+(-?[0-9.]+)(deg|rad|turn)?(?:\s*\/\s*[0-9.]+%?)?\s*\)$/i);
      if (!m) return null;

      const L = m[1].endsWith('%') ? parseFloat(m[1]) / 100 : parseFloat(m[1]);
      const C = parseFloat(m[2]);
      let h = parseFloat(m[3]);
      if (m[4] === 'rad') h = h * 180 / Math.PI;
      if (m[4] === 'turn') h = h * 360;

      const hr = h * Math.PI / 180;
      const a = C * Math.cos(hr);
      const b = C * Math.sin(hr);

      const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
      const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
      const s_ = L - 0.0894841775 * a - 1.2914855480 * b;

      const l = l_ * l_ * l_;
      const mm = m_ * m_ * m_;
      const s = s_ * s_ * s_;

      const r = srgbTransfer( 4.0767416621 * l - 3.3077115913 * mm + 0.2309699292 * s);
      const g = srgbTransfer(-1.2684380046 * l + 2.6097574011 * mm - 0.3413193965 * s);
      const bl = srgbTransfer(-0.0041960863 * l - 0.7034186147 * mm + 1.7076147010 * s);

      return `#${byteToHex(r)}${byteToHex(g)}${byteToHex(bl)}`;
    }

    function colorToHex(c) {
      if (!c) return '#888888';
      if (HEX_RE.test(c)) return c.toLowerCase();
      const oklch = oklchToHex(c);
      if (oklch) return oklch;
      try {
        if (!_hexCtx) _hexCtx = document.createElement('canvas').getContext('2d');
        _hexCtx.fillStyle = '#000000';
        _hexCtx.fillStyle = c;
        const v = _hexCtx.fillStyle;
        if (typeof v === 'string' && v.startsWith('#')) {
          if (v.length === 4) return ('#' + v[1]+v[1] + v[2]+v[2] + v[3]+v[3]).toLowerCase();
          return v.length > 7 ? v.slice(0, 7).toLowerCase() : v.toLowerCase();
        }
      } catch {}
      return '#888888';
    }

    /* ─── Linkify ─── */
    function linkify(text) {
      if (!text) return null;
      const out = [];
      let last = 0, m;
      URL_RE.lastIndex = 0;
      while ((m = URL_RE.exec(text)) !== null) {
        if (m.index > last) out.push(text.slice(last, m.index));
        out.push(
          <a key={`u${m.index}`}
             href={m[0]}
             target="_blank"
             rel="noopener noreferrer"
             className="no-drag"
             draggable={false}
             onClick={e => e.stopPropagation()}
             onMouseDown={e => e.stopPropagation()}
             onKeyDown={e => e.stopPropagation()}>{m[0]}</a>
        );
        last = m.index + m[0].length;
      }
      if (last < text.length) out.push(text.slice(last));
      return out;
    }

    /* ─── Seed ─── */
    function formatNotes(text) {
      if (!text) return null;
      return text.split('\n').map((line, idx, arr) => (
        <React.Fragment key={idx}>
          {line ? linkify(line) : '\u00a0'}
          {idx < arr.length - 1 && <br />}
        </React.Fragment>
      ));
    }

    function todayISO() {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 10);
    }

    function dueStatus(card) {
      if (!card?.due) return null;
      if (card.complete) return 'complete';
      const today = todayISO();
      if (card.due < today) return 'overdue';
      if (card.due === today) return 'today';
      return 'future';
    }

    function formatDueDate(date) {
      if (!date) return '';
      const [y, m, d] = date.split('-').map(Number);
      if (!y || !m || !d) return date;
      return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function sortCardsByDueList(cards, dir) {
      return [...(cards || [])]
        .map((card, idx) => ({ card, idx }))
        .sort((a, b) => {
          const ad = a.card.due || '';
          const bd = b.card.due || '';
          if (ad && bd) {
            const cmp = ad.localeCompare(bd);
            return (dir === 'asc' ? cmp : -cmp) || (a.idx - b.idx);
          }
          if (ad && !bd) return dir === 'asc' ? -1 : 1;
          if (!ad && bd) return dir === 'asc' ? 1 : -1;
          return a.idx - b.idx;
        })
        .map(item => item.card);
    }

    function formatBytes(bytes) {
      if (!bytes) return '';
      const units = ['B', 'KB', 'MB', 'GB'];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit++;
      }
      return `${value >= 10 || unit === 0 ? Math.round(value) : value.toFixed(1)} ${units[unit]}`;
    }

    /* ─── Migration / load / save ─── */
    function makeBlankBoard(title = 'Kanban') {
      const cards = {};
      DEFAULT_COLUMNS.forEach(c => { cards[c.id] = []; });
      return {
        version: 2,
        title,
        columns: DEFAULT_COLUMNS.map(c => ({ ...c })),
        labels: DEFAULT_LABELS.map(l => ({ ...l })),
        cards,
      };
    }

    function migrate(raw) {
      if (!raw || typeof raw !== 'object') return makeSeed();
      if (raw.version === 2 && raw.columns && raw.cards) {
        const cards = {};
        raw.columns.forEach(col => {
          const list = Array.isArray(raw.cards[col.id]) ? raw.cards[col.id] : [];
          cards[col.id] = list.map(c => ({
            id: c.id || uid(),
            title: c.title || '',
            notes: c.notes || '',
            labels: Array.isArray(c.labels) ? c.labels : [],
            due: typeof c.due === 'string' ? c.due : '',
            complete: !!c.complete,
            attachments: Array.isArray(c.attachments)
              ? c.attachments.map(a => ({
                  id: a.id || uid('att'),
                  name: a.name || 'Attachment',
                  type: a.type || '',
                  size: Number.isFinite(a.size) ? a.size : 0,
                  lastModified: Number.isFinite(a.lastModified) ? a.lastModified : 0,
                  hasHandle: !!a.hasHandle,
                }))
              : [],
            checklist: Array.isArray(c.checklist)
              ? c.checklist.map(it => ({ id: it.id || uid('ck'), text: it.text || '', done: !!it.done }))
              : [],
          }));
        });
        return {
          version: 2,
          title: typeof raw.title === 'string' && raw.title.trim() ? raw.title.trim() : 'Kanban',
          columns: raw.columns.map(c => ({ id: c.id, label: c.label, color: c.color || COL_PALETTE[0] })),
          labels: Array.isArray(raw.labels) && raw.labels.length ? raw.labels : DEFAULT_LABELS.map(l => ({ ...l })),
          cards,
        };
      }
      // legacy v1
      const cards = {};
      DEFAULT_COLUMNS.forEach(c => {
        cards[c.id] = (Array.isArray(raw[c.id]) ? raw[c.id] : []).map(card => ({
          id: card.id || uid(),
          title: card.title || '',
          notes: card.notes || '',
          labels: [],
          due: '',
          complete: false,
          attachments: [],
          checklist: [],
        }));
      });
      return {
        version: 2,
        title: 'Kanban',
        columns: DEFAULT_COLUMNS.map(c => ({ ...c })),
        labels: DEFAULT_LABELS.map(l => ({ ...l })),
        cards,
      };
    }

    function loadBoard() {
      try {
        const v2 = localStorage.getItem(STORAGE);
        if (v2) return migrate(JSON.parse(v2));
        const v1 = localStorage.getItem(LEGACY);
        if (v1) return migrate(JSON.parse(v1));
      } catch {}
      return makeSeed();
    }

    function saveBoard(b) {
      try { localStorage.setItem(STORAGE, JSON.stringify(b)); } catch {}
    }

    function loadBackupMeta() {
      try {
        return JSON.parse(localStorage.getItem(BACKUP_META)) || {};
      } catch {
        return {};
      }
    }

    function saveBackupMeta(meta) {
      try { localStorage.setItem(BACKUP_META, JSON.stringify(meta)); } catch {}
    }

    function clearBackupMeta() {
      try { localStorage.removeItem(BACKUP_META); } catch {}
    }

    const supportsFileBackups = () =>
      'showSaveFilePicker' in window && 'showDirectoryPicker' in window;

    const jsonFileName = (title, suffix = '') => {
      const slug = (title || 'kanban').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'kanban';
      return `${slug}${suffix}.json`;
    };

    const datedJsonFileName = (title) => {
      const slug = (title || 'kanban').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'kanban';
      const ts = new Date().toISOString().slice(0, 10);
      return `${slug}-${ts}.json`;
    };

    function openBackupDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('kanban-backup-db', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('handles');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGet(key) {
      const db = await openBackupDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('handles', 'readonly');
        const req = tx.objectStore('handles').get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        tx.oncomplete = () => db.close();
      });
    }

    async function idbSet(key, value) {
      const db = await openBackupDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('handles', 'readwrite');
        tx.objectStore('handles').put(value, key);
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbDelete(key) {
      const db = await openBackupDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('handles', 'readwrite');
        tx.objectStore('handles').delete(key);
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbKeys(prefix = '') {
      const db = await openBackupDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('handles', 'readonly');
        const req = tx.objectStore('handles').getAllKeys();
        req.onsuccess = () => {
          const keys = (req.result || []).map(String);
          resolve(prefix ? keys.filter(key => key.startsWith(prefix)) : keys);
        };
        req.onerror = () => reject(req.error);
        tx.oncomplete = () => db.close();
      });
    }

    async function verifyWritePermission(handle, ask = false) {
      if (!handle) return false;
      const opts = { mode: 'readwrite' };
      if ((await handle.queryPermission?.(opts)) === 'granted') return true;
      if (ask && (await handle.requestPermission?.(opts)) === 'granted') return true;
      return false;
    }

    /* ─── App ─── */
    function App() {
      const [board, setBoard]       = useState(loadBoard);
      const [modal, setModal]       = useState(null);
      const [addingTo, setAddingTo] = useState(null);
      const [saveFx, setSaveFx]     = useState(false);
      const [dark, setDark]         = useState(() => localStorage.getItem('kb-theme') === 'dark');
      const [filterIds, setFilterIds] = useState([]);          // active label-id filters (OR)
      const [labelMgrOpen, setLabelMgrOpen] = useState(false);
      const [nextDueSortDir, setNextDueSortDir] = useState('asc');
      const [columnDueSortDirs, setColumnDueSortDirs] = useState({});
      const [backupStatus, setBackupStatus] = useState(() => {
        if (!supportsFileBackups()) return { kind: 'unsupported', text: 'manual export' };
        const meta = loadBackupMeta();
        return meta.fileName ? { kind: 'linked', text: meta.fileName } : { kind: 'idle', text: 'no backup' };
      });

      const [draggingId, setDraggingId] = useState(null);
      const [dropTarget, setDropTarget] = useState(null);
      const [pointerDrag, setPointerDrag] = useState(null);
      const [draggingCol, setDraggingCol] = useState(null);
      const [colDropTarget, setColDropTarget] = useState(null);

      const dragRef    = useRef(null);
      const pointerDragRef = useRef(null);
      const dropTargetRef = useRef(null);
      const colDragRef = useRef(null);
      const saveTimer  = useRef(null);
      const backupTimer = useRef(null);
      const backupFileRef = useRef(null);
      const backupDirRef = useRef(null);
      const storedBackupRef = useRef(null);
      const backupPickerHandleRef = useRef(null);
      const backupDirPickerHandleRef = useRef(null);
      const jsonPickerHandleRef = useRef(null);
      const boardRef   = useRef(board);

      useEffect(() => { boardRef.current = board; }, [board]);
      useLayoutEffect(() => {
        document.documentElement.classList.toggle('dark', dark);
        localStorage.setItem('kb-theme', dark ? 'dark' : 'light');
      }, [dark]);
      useEffect(() => {
        document.title = board.title || 'Kanban';
      }, [board.title]);

      useEffect(() => {
        let cancelled = false;
        const liveAttachmentKeys = new Set();
        Object.values(board.cards || {}).forEach(cards => {
          (cards || []).forEach(card => {
            (card.attachments || []).forEach(att => {
              if (att?.id) liveAttachmentKeys.add(`att:${att.id}`);
            });
          });
        });

        (async () => {
          try {
            const keys = await idbKeys('att:');
            if (cancelled) return;
            await Promise.all(
              keys
                .filter(key => !liveAttachmentKeys.has(key))
                .map(key => idbDelete(key))
            );
          } catch (err) {
            console.warn('Could not clear stale attachment handles', err);
          }
        })();
        return () => { cancelled = true; };
      }, [board.cards]);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const handle = await idbGet('jsonPicker');
            if (!cancelled) jsonPickerHandleRef.current = handle || null;
          } catch (err) {
            console.warn('Could not restore JSON picker location', err);
          }
        })();
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const saved = await idbGet('backupPicker');
            const savedDir = await idbGet('backupDirPicker');
            if (cancelled) return;
            backupPickerHandleRef.current = saved || null;
            backupDirPickerHandleRef.current = savedDir || null;
          } catch (err) {
            console.warn('Could not restore backup picker location', err);
          }
        })();
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        if (!supportsFileBackups()) return;
        let cancelled = false;
        (async () => {
          try {
            const saved = await idbGet('backup');
            if (cancelled) return;
            if (!saved?.fileHandle) {
              setBackupStatus({ kind: 'idle', text: 'no backup' });
              return;
            }
            storedBackupRef.current = saved;
            const fileOk = await verifyWritePermission(saved.fileHandle, false);
            const dirOk = saved.dirHandle ? await verifyWritePermission(saved.dirHandle, false) : false;
            if (fileOk) {
              backupFileRef.current = saved.fileHandle;
              backupDirRef.current = dirOk ? saved.dirHandle : null;
              backupPickerHandleRef.current = saved.fileHandle;
              if (dirOk) backupDirPickerHandleRef.current = saved.dirHandle;
              setBackupStatus({ kind: 'linked', text: saved.fileHandle.name || 'backup linked' });
              scheduleBackup(boardRef.current);
            } else {
              setBackupStatus({ kind: 'idle', text: 'reconnect backup' });
            }
          } catch (err) {
            console.warn('Could not restore backup handle', err);
          }
        })();
        return () => { cancelled = true; };
      }, []);

      // prune filter ids if the labels they reference no longer exist
      useEffect(() => {
        const valid = new Set(board.labels.map(l => l.id));
        setFilterIds(ids => ids.filter(id => valid.has(id)));
      }, [board.labels]);

      const commit = useCallback((updater) => {
        setBoard(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          saveBoard(next);
          scheduleBackup(next);
          setSaveFx(true);
          clearTimeout(saveTimer.current);
          saveTimer.current = setTimeout(() => setSaveFx(false), 1900);
          return next;
        });
      }, []);

      const writeFile = async (handle, text) => {
        const writable = await handle.createWritable();
        await writable.write(text);
        await writable.close();
      };

      const writeBackup = async (nextBoard, manual = false) => {
        if (!backupFileRef.current) {
          if (manual) setBackupStatus({ kind: 'idle', text: 'choose backup' });
          return;
        }

        setBackupStatus({ kind: 'saving', text: 'saving...' });
        try {
          const json = JSON.stringify(nextBoard, null, 2);
          if (backupDirRef.current) {
            try {
              const previousHandle = await backupDirRef.current.getFileHandle(
                jsonFileName(nextBoard.title, '.previous'),
                { create: true }
              );
              let previousText = null;
              try { previousText = await (await backupFileRef.current.getFile()).text(); } catch {}
              if (previousText) await writeFile(previousHandle, previousText);
            } catch {}
          }
          await writeFile(backupFileRef.current, json);
          setBackupStatus({ kind: 'saved', text: 'backup saved' });
          setTimeout(() => {
            if (backupFileRef.current) {
              setBackupStatus({ kind: 'linked', text: loadBackupMeta().fileName || 'backup linked' });
            }
          }, 1800);
        } catch (err) {
          setBackupStatus({ kind: 'error', text: 'backup failed' });
          console.warn('Kanban backup failed', err);
        }
      };

      const scheduleBackup = (nextBoard) => {
        if (!backupFileRef.current) return;
        clearTimeout(backupTimer.current);
        backupTimer.current = setTimeout(() => writeBackup(nextBoard), 700);
      };

      const chooseBackupFile = async () => {
        if (!supportsFileBackups()) {
          alert('Auto backup needs Chrome or Edge with the File System Access API. Export still works everywhere.');
          return;
        }
        try {
          if (storedBackupRef.current?.fileHandle) {
            const fileOk = await verifyWritePermission(storedBackupRef.current.fileHandle, true);
            const dirOk = storedBackupRef.current.dirHandle
              ? await verifyWritePermission(storedBackupRef.current.dirHandle, true)
              : false;
            if (fileOk) {
              backupFileRef.current = storedBackupRef.current.fileHandle;
              backupDirRef.current = dirOk ? storedBackupRef.current.dirHandle : null;
              setBackupStatus({ kind: 'linked', text: backupFileRef.current.name || 'backup linked' });
              await writeBackup(boardRef.current, true);
              return;
            }
          }

          const fileName = jsonFileName(boardRef.current.title);
          const backupStartIn = backupPickerHandleRef.current || jsonPickerHandleRef.current;
          const fileHandle = await window.showSaveFilePicker({
            id: BACKUP_PICKER_ID,
            ...(backupStartIn ? { startIn: backupStartIn } : {}),
            suggestedName: fileName,
            types: JSON_FILE_TYPES,
          });
          backupPickerHandleRef.current = fileHandle;
          idbSet('backupPicker', fileHandle).catch(err => console.warn('Could not remember backup picker location', err));
          let dirHandle = null;
          try {
            const dirStartIn = backupDirPickerHandleRef.current || fileHandle;
            dirHandle = await window.showDirectoryPicker({
              id: BACKUP_DIR_PICKER_ID,
              mode: 'readwrite',
              ...(dirStartIn ? { startIn: dirStartIn } : {}),
            });
            backupDirPickerHandleRef.current = dirHandle;
            idbSet('backupDirPicker', dirHandle).catch(err => console.warn('Could not remember backup folder picker location', err));
          } catch {}
          backupFileRef.current = fileHandle;
          backupDirRef.current = dirHandle;
          storedBackupRef.current = { fileHandle, dirHandle };
          await idbSet('backup', { fileHandle, dirHandle });
          saveBackupMeta({ fileName: fileHandle.name || fileName });
          setBackupStatus({ kind: 'linked', text: fileHandle.name || fileName });
          await writeBackup(boardRef.current, true);
        } catch (err) {
          if (err?.name !== 'AbortError') {
            setBackupStatus({ kind: 'error', text: 'backup failed' });
            console.warn('Backup picker failed', err);
          }
        }
      };

      /* ── Filter ── */
      const toggleFilter = useCallback((labelId) => {
        setFilterIds(ids => ids.includes(labelId) ? ids.filter(i => i !== labelId) : [...ids, labelId]);
      }, []);
      const clearFilter = () => setFilterIds([]);

      const sortCardsByDue = () => {
        const dir = nextDueSortDir;
        setNextDueSortDir(dir === 'asc' ? 'desc' : 'asc');
        commit(prev => {
          const cards = { ...prev.cards };
          prev.columns.forEach(col => {
            cards[col.id] = sortCardsByDueList(prev.cards[col.id] || [], dir);
          });
          return { ...prev, cards };
        });
      };

      const sortColumnByDue = (colId) => {
        const dir = columnDueSortDirs[colId] || 'asc';
        setColumnDueSortDirs(prev => ({ ...prev, [colId]: dir === 'asc' ? 'desc' : 'asc' }));
        commit(prev => ({
          ...prev,
          cards: {
            ...prev.cards,
            [colId]: sortCardsByDueList(prev.cards[colId] || [], dir),
          },
        }));
      };

      const renameBoard = (title) => {
        const t = title.trim();
        if (!t || t === boardRef.current.title) return;
        commit(prev => ({ ...prev, title: t }));
      };

      /* ── Card ops ── */
      const addCard = (colId, title, notes) => {
        if (!title.trim()) return;
        const card = {
          id: uid(), title: title.trim(), notes: notes.trim(),
          labels: filterIds.length > 0 ? [...filterIds] : [],

          complete: false,
          attachments: [],
          checklist: [],
        };

          ...prev,
          cards: {

      const updateCard = (colId, cardId, patch) => {
        commit(prev => ({
          ...prev,
          cards: {
            ...prev.cards,
            [colId]: prev.cards[colId].map(c => c.id === cardId ? { ...c, ...patch } : c),
          },
        }));
      };

      const deleteCard = (colId, cardId) => {
        commit(prev => ({
          ...prev,
          cards: { ...prev.cards, [colId]: prev.cards[colId].filter(c => c.id !== cardId) },
        }));
        setModal(null);
      };

      const toggleChecklistItem = (colId, cardId, itemId) => {
        commit(prev => ({
          ...prev,
          cards: {
            ...prev.cards,
            [colId]: prev.cards[colId].map(c => c.id !== cardId ? c : ({
              ...c,
              checklist: c.checklist.map(it => it.id === itemId ? { ...it, done: !it.done } : it),
            })),
          },
        }));
      };

      /* ── Column ops ── */
      const toggleCardComplete = (colId, cardId) => {
        commit(prev => ({
          ...prev,
          cards: {
            ...prev.cards,
            [colId]: prev.cards[colId].map(c => c.id === cardId ? { ...c, complete: !c.complete } : c),
          },
        }));
      };

      const addColumn = () => {
        const name = window.prompt('New column name', 'New column');
        if (!name || !name.trim()) return;
        const id = uid('col');
        const color = COL_PALETTE[boardRef.current.columns.length % COL_PALETTE.length];
        commit(prev => ({
          ...prev,
          columns: [...prev.columns, { id, label: name.trim(), color }],
          cards: { ...prev.cards, [id]: [] },
        }));
      };

      const renameColumn = (colId, label) => {
        const t = label.trim();
        if (!t) return;
        commit(prev => ({
          ...prev,
          columns: prev.columns.map(c => c.id === colId ? { ...c, label: t } : c),
        }));
      };

      const setColumnColor = (colId, color) => {
        commit(prev => ({
          ...prev,
          columns: prev.columns.map(c => c.id === colId ? { ...c, color } : c),
        }));
      };

      const deleteColumn = (colId) => {
        const cur = boardRef.current;
        const col = cur.columns.find(c => c.id === colId);
        const count = (cur.cards[colId] || []).length;
        const msg = count > 0
          ? `Delete "${col.label}" and its ${count} card${count === 1 ? '' : 's'}? This cannot be undone.`
          : `Delete "${col.label}"?`;
        if (!window.confirm(msg)) return;
        commit(prev => {
          const cards = { ...prev.cards };
          delete cards[colId];
          return {
            ...prev,
            columns: prev.columns.filter(c => c.id !== colId),
            cards,
          };
        });
      };

      const moveColumn = (fromIdx, insertIdx) => {
        if (fromIdx === insertIdx || fromIdx === insertIdx - 1) return;
        commit(prev => {
          const cols = [...prev.columns];
          const [moved] = cols.splice(fromIdx, 1);
          const adj = insertIdx > fromIdx ? insertIdx - 1 : insertIdx;
          cols.splice(adj, 0, moved);
          return { ...prev, columns: cols };
        });
      };

      /* ── Labels ── */
      const updateLabels = useCallback((newLabels) => {
        commit(prev => {
          const valid = new Set(newLabels.map(l => l.id));
          const cards = {};
          for (const cid in prev.cards) {
            cards[cid] = prev.cards[cid].map(c => ({
              ...c,
              labels: (c.labels || []).filter(id => valid.has(id)),
            }));
          }
          return { ...prev, labels: newLabels, cards };
        });
      }, [commit]);

      /* ── Card drag ── */
      const setCardDropTarget = (target) => {
        dropTargetRef.current = target;
        setDropTarget(dt => (dt?.col === target.col && dt?.idx === target.idx) ? dt : target);
      };

      const clearCardDragState = () => {
        if (pointerDragRef.current?.longPressTimer) {
          clearTimeout(pointerDragRef.current.longPressTimer);
        }
        removeCardPointerListeners();
        setDraggingId(null);
        setDropTarget(null);
        setPointerDrag(null);
        dragRef.current = null;
        pointerDragRef.current = null;
        dropTargetRef.current = null;
        document.body.classList.remove('card-pointer-dragging');
      };

      const getCardDropTarget = (areaEl, colId, clientY) => {
        if (!dragRef.current) return null;
        const list = boardRef.current.cards[colId] || [];
        if (list.length === 0 || (list.length === 1 && list[0].id === dragRef.current.cardId)) {
          return { col: colId, idx: 0 };
        }

        const srcId = dragRef.current.cardId;
        const cardEls = areaEl.querySelectorAll('.card[data-card-id]');

        let insertIdx = null;
        let lastVisibleDataIdx = -1;
        for (const el of cardEls) {
          if (el.dataset.cardId === srcId) continue;
          const dataIdx = +el.dataset.idx;
          const rect = el.getBoundingClientRect();
          if (rect.height === 0) continue;
          if (clientY <= rect.top + rect.height / 2) {
            insertIdx = dataIdx;
            break;
          }
          lastVisibleDataIdx = dataIdx;
        }
        if (insertIdx === null) {
          insertIdx = lastVisibleDataIdx >= 0 ? lastVisibleDataIdx + 1 : list.length;
        }

        return { col: colId, idx: insertIdx };
      };

      const cardsAreaFromPoint = (clientX, clientY) => {
        const els = document.elementsFromPoint(clientX, clientY);
        for (const el of els) {
          const area = el.closest?.('.cards-area');
          if (area) return area;
          const col = el.closest?.('.column');
          const colArea = col?.querySelector?.('.cards-area');
          if (colArea) return colArea;
        }
        return null;
      };

      const moveCardToDropTarget = () => {
        const target = dropTargetRef.current || dropTarget;
        if (!dragRef.current || !target) return false;
        const { colId: src, idx: srcIdx } = dragRef.current;
        const { col: dst, idx: dstIdx } = target;
        commit(prev => {
          const next = { ...prev, cards: { ...prev.cards } };
          prev.columns.forEach(c => { next.cards[c.id] = [...prev.cards[c.id]]; });
          const [moved] = next.cards[src].splice(srcIdx, 1);
          if (!moved) return prev;
          let ins = dstIdx;
          if (src === dst && dstIdx > srcIdx) ins--;
          next.cards[dst].splice(Math.max(0, ins), 0, moved);
          return next;
        });
        return true;
      };

      const onDragStart = (e, cardId, colId, idx) => {
        const target = e.target.closest ? e.target : e.target.parentElement;
        if (target?.closest('.no-drag')) { e.preventDefault(); return; }
        dragRef.current = { cardId, colId, idx };

        // ghost: tilted clone of the card
        const el = e.currentTarget;
        const clone = el.cloneNode(true);
        Object.assign(clone.style, {
          position: 'fixed', top: '-9999px', left: '0',
          width: el.offsetWidth + 'px',
          transform: 'rotate(2.5deg) scale(1.04)',
          boxShadow: '0 12px 36px oklch(0.2 0 0 / 0.22)',
          borderRadius: '10px',
          background: 'var(--card-bg)',
          color: 'var(--text)',
          padding: '13px 15px',
          opacity: '0.96',
          pointerEvents: 'none',
          fontFamily: "'DM Sans', sans-serif",
          display: 'block',
        });
        document.body.appendChild(clone);
        try { e.dataTransfer.setDragImage(clone, Math.round(el.offsetWidth / 2), 30); } catch {}
        requestAnimationFrame(() => clone.parentNode && document.body.removeChild(clone));
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', cardId); } catch {}

        setDraggingId(cardId);
        setCardDropTarget({ col: colId, idx });
      };

      const onDragEnd = () => {
        clearCardDragState();
      };

      const onDragOverArea = (e, colId) => {
        if (!dragRef.current) return;
        e.preventDefault();
        e.stopPropagation();

        const target = getCardDropTarget(e.currentTarget, colId, e.clientY);
        if (target) setCardDropTarget(target);
      };

      const onDrop = (e, colId) => {
        e.preventDefault();
        if (!dragRef.current) return;
        moveCardToDropTarget();
        clearCardDragState();
      };

      /* ── Column drag ── */
      const addCardPointerListeners = () => {
        removeCardPointerListeners();
        window.addEventListener('pointermove', onCardWindowPointerMove, true);
        window.addEventListener('pointerup', onCardWindowPointerUp, true);
        window.addEventListener('pointercancel', onCardWindowPointerCancel, true);
        window.addEventListener('keydown', onCardWindowKeyDown, true);
        window.addEventListener('blur', onCardWindowBlur);
      };

      const removeCardPointerListeners = () => {
        window.removeEventListener('pointermove', onCardWindowPointerMove, true);
        window.removeEventListener('pointerup', onCardWindowPointerUp, true);
        window.removeEventListener('pointercancel', onCardWindowPointerCancel, true);
        window.removeEventListener('keydown', onCardWindowKeyDown, true);
        window.removeEventListener('blur', onCardWindowBlur);
      };

      const onCardWindowPointerMove = (e) => onCardPointerMove(e);
      const onCardWindowPointerUp = (e) => onCardPointerUp(e);
      const onCardWindowPointerCancel = (e) => onCardPointerCancel(e);
      const onCardWindowKeyDown = (e) => {
        if (e.key === 'Escape') clearCardDragState();
      };
      const onCardWindowBlur = () => clearCardDragState();

      const suppressNextCardClick = () => {
        window.__kanbanSuppressCardClickUntil = Date.now() + 650;
      };

      const startCardPointerDrag = (d) => {
        if (!d || d.dragging) return false;
        if (d.longPressTimer) {
          clearTimeout(d.longPressTimer);
          d.longPressTimer = null;
        }
        d.dragging = true;
        dragRef.current = { cardId: d.cardId, colId: d.colId, idx: d.idx };
        setDraggingId(d.cardId);
        setCardDropTarget({ col: d.colId, idx: d.idx });
        document.body.classList.add('card-pointer-dragging');
        return true;
      };

      const onCardPointerDown = (e, cardId, colId, idx) => {
        const target = e.target.closest ? e.target : e.target.parentElement;
        if (e.button !== 0 || target?.closest('.no-drag')) return false;

        const rect = e.currentTarget.getBoundingClientRect();
        pointerDragRef.current = {
          pointerId: e.pointerId,
          sourceEl: e.currentTarget,
          cardId, colId, idx,
          startX: e.clientX,
          startY: e.clientY,
          x: e.clientX,
          y: e.clientY,
          offsetX: e.clientX - rect.left,
          offsetY: e.clientY - rect.top,
          width: rect.width,
          height: rect.height,
          dragging: false,
          longPressTimer: null,
        };
        pointerDragRef.current.longPressTimer = setTimeout(() => {
          const d = pointerDragRef.current;
          if (!d || d.pointerId !== e.pointerId || d.dragging) return;
          startCardPointerDrag(d);
          const { sourceEl, longPressTimer, ...viewDrag } = d;
          setPointerDrag({ ...viewDrag });
        }, 320);
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
        addCardPointerListeners();
        return true;
      };

      const onCardPointerMove = (e) => {
        const d = pointerDragRef.current;
        if (!d || d.pointerId !== e.pointerId) return false;

        const dx = e.clientX - d.startX;
        const dy = e.clientY - d.startY;
        if (!d.dragging && Math.hypot(dx, dy) < 5) return false;

        e.preventDefault();
        const startedThisMove = !d.dragging;
        d.x = e.clientX;
        d.y = e.clientY;

        const updateCurrentCardDropTarget = () => {
          const area = cardsAreaFromPoint(e.clientX, e.clientY);
          const colId = area?.dataset?.colId;
          if (area && colId) {
            const target = getCardDropTarget(area, colId, e.clientY);
            if (target) setCardDropTarget(target);
          }
        };

        if (!d.dragging) startCardPointerDrag(d);

        const { sourceEl, longPressTimer, ...viewDrag } = d;
        setPointerDrag({ ...viewDrag });

        updateCurrentCardDropTarget();

        if (d.dragging && e.buttons === 0 && !startedThisMove) {
          suppressNextCardClick();
          moveCardToDropTarget();
          clearCardDragState();
        }

        return true;
      };

      const onCardPointerUp = (e) => {
        const d = pointerDragRef.current;
        if (!d || d.pointerId !== e.pointerId) return false;
        try { d.sourceEl?.releasePointerCapture(e.pointerId); } catch {}

        const wasDragging = !!d.dragging;
        if (wasDragging) {
          e.preventDefault();
          suppressNextCardClick();
          moveCardToDropTarget();
        }
        clearCardDragState();
        return wasDragging;
      };

      const onCardPointerCancel = (e) => {
        const d = pointerDragRef.current;
        if (!d || d.pointerId !== e.pointerId) return false;
        try { d.sourceEl?.releasePointerCapture(e.pointerId); } catch {}
        const wasDragging = !!d.dragging;
        if (wasDragging) suppressNextCardClick();
        clearCardDragState();
        return wasDragging;
      };

      const onColDragStart = (e, colId, idx) => {
        const target = e.target.closest ? e.target : e.target.parentElement;
        if (target?.closest('input, button, .col-delete, .no-drag')) {
          e.preventDefault();
          return;
        }
        colDragRef.current = { colId, idx };
        setDraggingCol(colId);
        e.dataTransfer.effectAllowed = 'move';
        try {
          const ghost = document.createElement('div');
          ghost.style.cssText = 'position:fixed;top:-9999px;width:1px;height:1px';
          document.body.appendChild(ghost);
          e.dataTransfer.setDragImage(ghost, 0, 0);
          requestAnimationFrame(() => ghost.parentNode && document.body.removeChild(ghost));
        } catch {}
      };

      const onColDragOver = (e, idx) => {
        if (!colDragRef.current) return;
        e.preventDefault();
        e.stopPropagation();
        const rect = e.currentTarget.getBoundingClientRect();
        const insertIdx = e.clientX < rect.left + rect.width / 2 ? idx : idx + 1;
        setColDropTarget(t => t?.idx === insertIdx ? t : { idx: insertIdx });
      };

      const onColDrop = () => {
        if (!colDragRef.current || !colDropTarget) {
          setDraggingCol(null); setColDropTarget(null); colDragRef.current = null;
          return;
        }
        moveColumn(colDragRef.current.idx, colDropTarget.idx);
        setDraggingCol(null); setColDropTarget(null); colDragRef.current = null;
      };

      const onColDragEnd = () => {
        setDraggingCol(null); setColDropTarget(null); colDragRef.current = null;
      };

      /* ── Import / export ── */
      const fallbackExport = (nextBoard) => {
        const blob = new Blob([JSON.stringify(nextBoard, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        Object.assign(document.createElement('a'), { href: url, download: datedJsonFileName(nextBoard.title) }).click();
        URL.revokeObjectURL(url);
      };

      const rememberJsonPickerHandle = (handle) => {
        if (!handle) return;
        jsonPickerHandleRef.current = handle;
        idbSet('jsonPicker', handle).catch(err => console.warn('Could not remember JSON picker location', err));
      };

      const jsonPickerOptions = (extra = {}) => ({
        id: JSON_PICKER_ID,
        types: JSON_FILE_TYPES,
        ...(jsonPickerHandleRef.current ? { startIn: jsonPickerHandleRef.current } : {}),
        ...extra,
      });

      const onExport = async () => {
        const nextBoard = boardRef.current;
        const json = JSON.stringify(nextBoard, null, 2);
        if ('showSaveFilePicker' in window) {
          try {
            const handle = await window.showSaveFilePicker(jsonPickerOptions({
              suggestedName: datedJsonFileName(nextBoard.title),
            }));
            rememberJsonPickerHandle(handle);
            await writeFile(handle, json);
            return;
          } catch (err) {
            if (err?.name === 'AbortError') return;
            console.warn('Save picker failed, falling back to download', err);
          }
        }
        fallbackExport(nextBoard);
      };

      const importBoardText = (text) => {
        try {
          const parsed = JSON.parse(text);
          const next = migrate(parsed);
          commit(next);
        } catch {
          alert('Invalid JSON file.');
        }
      };

      const fallbackImport = () => {
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = '.json,application/json';
        inp.onchange = ev => {
          const f = ev.target.files[0]; if (!f) return;
          const r = new FileReader();
          r.onload = e => importBoardText(e.target.result);
          r.readAsText(f);
        };
        inp.click();
      };

      const onImport = async () => {
        if ('showOpenFilePicker' in window) {
          try {
            const [handle] = await window.showOpenFilePicker(jsonPickerOptions({
              multiple: false,
            }));
            if (!handle) return;
            rememberJsonPickerHandle(handle);
            const file = await handle.getFile();
            importBoardText(await file.text());
            return;
          } catch (err) {
            if (err?.name === 'AbortError') return;
            console.warn('Open picker failed, falling back to file input', err);
          }
        }
        fallbackImport();
      };

      const onNewBoard = () => {
        const ok = window.confirm(
          'Create a new blank board? This will replace the current board in this browser and disconnect Auto Backup. Export JSON first if you want a guaranteed restore point.'
        );
        if (!ok) return;
        clearTimeout(backupTimer.current);
        backupFileRef.current = null;
        backupDirRef.current = null;
        storedBackupRef.current = null;
        clearBackupMeta();
        if (supportsFileBackups()) setBackupStatus({ kind: 'idle', text: 'no backup' });
        else setBackupStatus({ kind: 'unsupported', text: 'manual export' });
        idbDelete('backup').catch(err => console.warn('Could not clear backup handle', err));
        setModal(null);
        setAddingTo(null);
        setLabelMgrOpen(false);
        setFilterIds([]);
        commit(makeBlankBoard());
      };

      /* ── Keyboard shortcuts ── */
      useEffect(() => {
        const isTyping = (el) => {
          if (!el) return false;
          const tag = el.tagName;
          return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
        };
        const onKey = (e) => {
          if (isTyping(e.target)) return;
          if (modal || addingTo !== null || labelMgrOpen) return;
          if (e.ctrlKey || e.metaKey || e.altKey) return;

          if (e.key === 'n' || e.key === 'N') {
            const focused = document.activeElement;
            let colId = boardRef.current.columns[0]?.id;
            if (focused && focused.classList && focused.classList.contains('card') && focused.dataset.colId) {
              colId = focused.dataset.colId;
            }
            if (colId) { e.preventDefault(); setAddingTo(colId); }
            return;
          }

          if (e.key === 'Escape' && filterIds.length > 0) {
            e.preventDefault();
            clearFilter();
            return;
          }

          if (e.key.startsWith('Arrow')) {
            const focused = document.activeElement;
            const cur = boardRef.current;

            if (!focused || !focused.classList?.contains('card')) {
              if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                for (const col of cur.columns) {
                  const first = document.querySelector(`.card[data-col-id="${col.id}"]`);
                  if (first) { first.focus(); e.preventDefault(); return; }
                }
              }
              return;
            }

            const colId = focused.dataset.colId;
            const idx   = +focused.dataset.idx;
            const colIdx = cur.columns.findIndex(c => c.id === colId);
            if (colIdx < 0) return;

            // Walk visible cards (data-idx) in current column for vertical, target col for horizontal
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
              const dir = e.key === 'ArrowDown' ? 1 : -1;
              const sibs = Array.from(document.querySelectorAll(`.card[data-col-id="${colId}"]`));
              const ordered = sibs.sort((a, b) => +a.dataset.idx - +b.dataset.idx);
              const pos = ordered.findIndex(el => +el.dataset.idx === idx);
              const target = ordered[pos + dir];
              if (target) {
                e.preventDefault();
                target.focus();
                target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
              }
              return;
            }

            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
              const step = e.key === 'ArrowRight' ? 1 : -1;
              for (let nci = colIdx + step; nci >= 0 && nci < cur.columns.length; nci += step) {
                const targetColId = cur.columns[nci].id;
                const sibs = Array.from(document.querySelectorAll(`.card[data-col-id="${targetColId}"]`));
                if (sibs.length === 0) continue;
                sibs.sort((a, b) => +a.dataset.idx - +b.dataset.idx);
                const target = sibs[Math.min(idx, sibs.length - 1)] || sibs[0];
                e.preventDefault();
                target.focus();
                target.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
                return;
              }
            }
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [modal, addingTo, labelMgrOpen, filterIds.length]);

      const modalCard = useMemo(() => {
        if (!modal) return null;
        return (board.cards[modal.colId] || []).find(c => c.id === modal.cardId) || null;
      }, [modal, board]);
      const pointerGhostCard = useMemo(() => {
        if (!pointerDrag?.dragging) return null;
        return (board.cards[pointerDrag.colId] || []).find(c => c.id === pointerDrag.cardId) || null;
      }, [pointerDrag, board]);

      return (
        <>
          <TopBar
            title={board.title || 'Kanban'}
            onRenameBoard={renameBoard}
            saveFx={saveFx}
            backupStatus={backupStatus}
            onChooseBackup={chooseBackupFile}
            onExport={onExport}
            onImport={onImport}
            onNewBoard={onNewBoard}
            onSortDue={sortCardsByDue}
            dueSortDir={nextDueSortDir}
            dark={dark}
            onToggleDark={() => setDark(d => !d)}
            onManageLabels={() => setLabelMgrOpen(true)}
            labels={board.labels}
            filterIds={filterIds}
            onToggleFilter={toggleFilter}
            onClearFilter={clearFilter}
          />
          <main className="board" onDrop={onColDrop} onDragOver={e => { if (colDragRef.current) e.preventDefault(); }}>
            {board.columns.map((col, colIdx) => (
              <Column
                key={col.id}
                def={col}
                colIdx={colIdx}
                cards={board.cards[col.id] || []}
                labels={board.labels}
                filterIds={filterIds}
                draggingId={draggingId}
                dropTarget={dropTarget}
                addingTo={addingTo}
                draggingCol={draggingCol}
                colDropIdx={colDropTarget?.idx}
                onDragStart={onDragStart}
                onDragEnd={onDragEnd}
                onDragOverArea={onDragOverArea}
                onDrop={onDrop}
                onCardPointerDown={onCardPointerDown}
                onCardPointerMove={onCardPointerMove}
                onCardPointerUp={onCardPointerUp}
                onCardPointerCancel={onCardPointerCancel}
                onColDragStart={onColDragStart}
                onColDragOver={onColDragOver}
                onColDragEnd={onColDragEnd}
                onEdit={card => setModal({ cardId: card.id, colId: col.id })}
                onAdd={addCard}
                onStartAdd={() => setAddingTo(col.id)}
                onCancelAdd={() => setAddingTo(null)}
                onRename={renameColumn}
                onColor={setColumnColor}
                onDelete={deleteColumn}
                onSortDue={sortColumnByDue}
                dueSortDir={columnDueSortDirs[col.id] || 'asc'}
                onToggleChecklistItem={toggleChecklistItem}
                onToggleCardComplete={toggleCardComplete}
                onToggleFilter={toggleFilter}
              />
            ))}
            <button className="col-add-btn" onClick={addColumn} aria-label="Add column">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                <path d="M6.5 1v11M1 6.5h11" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
              </svg>
              Add column
            </button>
          </main>
          {pointerGhostCard && (
            <CardDragGhost
              card={pointerGhostCard}
              labels={board.labels}
              drag={pointerDrag}
            />
          )}
          {modalCard && (
            <EditModal
              card={modalCard}
              colId={modal.colId}
              columns={board.columns}
              labels={board.labels}
              onUpdate={(patch) => updateCard(modal.colId, modal.cardId, patch)}
              onDelete={() => deleteCard(modal.colId, modal.cardId)}
              onClose={() => setModal(null)}
            />
          )}
          {labelMgrOpen && (
            <LabelManager
              labels={board.labels}
              onSave={updateLabels}
              onClose={() => setLabelMgrOpen(false)}
            />
          )}
        </>
      );
    }

    /* ─── TopBar ─── */
    function TopBar({ title, onRenameBoard, saveFx, backupStatus, onChooseBackup, onExport, onImport, onNewBoard, onSortDue, dueSortDir, dark, onToggleDark, onManageLabels, labels, filterIds, onToggleFilter, onClearFilter }) {
      const filterLabels = filterIds.map(id => labels.find(l => l.id === id)).filter(Boolean);
      const [draftTitle, setDraftTitle] = useState(title);
      const [backupMenuOpen, setBackupMenuOpen] = useState(false);
      const backupMenuRef = useRef(null);

      useEffect(() => { setDraftTitle(title); }, [title]);
      useEffect(() => {
        if (!backupMenuOpen) return;
        const onPointerDown = (e) => {
          if (!backupMenuRef.current?.contains(e.target)) setBackupMenuOpen(false);
        };
        const onKey = (e) => {
          if (e.key === 'Escape') setBackupMenuOpen(false);
        };
        document.addEventListener('pointerdown', onPointerDown);
        document.addEventListener('keydown', onKey);
        return () => {
          document.removeEventListener('pointerdown', onPointerDown);
          document.removeEventListener('keydown', onKey);
        };
      }, [backupMenuOpen]);

      const finishTitle = (commit) => {
        const next = draftTitle.trim();
        if (commit && next) onRenameBoard(next);
        else setDraftTitle(title);
      };
      const runBackupAction = (fn) => {
        setBackupMenuOpen(false);
        fn();
      };
      const backupNeedsAttention = !['linked', 'saved', 'saving'].includes(backupStatus.kind);
      const backupButtonClass = [
        'tbtn',
        backupNeedsAttention ? 'backup-attention' : 'backup-ok',
      ].join(' ');

      return (
        <header className="topbar" role="banner">
          <input
            className="topbar-logo"
            value={draftTitle}
            size={Math.max(6, Math.min(28, draftTitle.length || 6))}
            onChange={e => setDraftTitle(e.target.value)}
            onBlur={() => finishTitle(true)}
            onKeyDown={e => {
              if (e.key === 'Enter') e.currentTarget.blur();
              if (e.key === 'Escape') {
                setDraftTitle(title);
                e.currentTarget.blur();
              }
            }}
            aria-label="Board name"
            title="Rename board"
            spellCheck={false}
          />
          <div className="topbar-pip" aria-hidden="true"></div>

          {filterLabels.length > 0 && (
            <div className="filter-strip" role="region" aria-label="Active filters">
              <span className="filter-strip-label">Filter</span>
              {filterLabels.map(lab => (
                <button
                  key={lab.id}
                  className="label-pill btn filter-active"
                  style={{ background: lab.color, color: 'white' }}
                  onClick={() => onToggleFilter(lab.id)}
                  title={`Remove ${lab.name} from filter`}
                  aria-label={`Remove ${lab.name} from filter`}
                >
                  {lab.name}
                  <span className="x" aria-hidden="true">✕</span>
                </button>
              ))}
              <button className="filter-clear" onClick={onClearFilter}>clear</button>
            </div>
          )}

          <div className="topbar-spacer"></div>

          <div className="kbd-hint" title="Keyboard shortcuts">
            <span><span className="kbd">N</span> new</span>
            <span><span className="kbd">←</span><span className="kbd">→</span><span className="kbd">↑</span><span className="kbd">↓</span> nav</span>
          </div>
          <div className={`save-badge${saveFx ? ' show' : ''}`} aria-live="polite" aria-label={saveFx ? 'Saved' : ''}>
            <div className="save-badge-dot"></div>
            Saved
          </div>
          <button
            className="tbtn"
            onClick={onSortDue}
            title={dueSortDir === 'asc' ? 'Sort due dates earliest first' : 'Sort due dates latest first'}
            aria-label={dueSortDir === 'asc' ? 'Sort due dates earliest first' : 'Sort due dates latest first'}
          >
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
              <path d="M2.2 2.2h8.6v8.6H2.2V2.2z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/>
              <path d="M2.2 4.7h8.6M4.2 1.2v2M8.8 1.2v2" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
              {dueSortDir === 'asc' ? (
                <path d="M6.5 10V6.6M4.9 8.1l1.6-1.6 1.6 1.6" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>
              ) : (
                <path d="M6.5 6.2v3.4M4.9 8.1l1.6 1.6 1.6-1.6" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>
              )}
            </svg>
            Due
          </button>
          <button
            className="theme-toggle"
            onClick={onToggleDark}
            aria-label={dark ? 'Switch to light mode' : 'Switch to dark mode'}
            title={dark ? 'Light mode' : 'Dark mode'}
          >
            <div className="toggle-track">
              <div className={`toggle-icon${!dark ? ' active' : ''}`}>
                <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
                  <circle cx="5.5" cy="5.5" r="2.3" stroke="currentColor" strokeWidth="1.3"/>
                  <path d="M5.5 1v1M5.5 9v1M1 5.5h1M9 5.5h1M2.3 2.3l.7.7M7.7 7.7l.6.6M7.7 2.3l-.7.7M2.3 7.7l.6.6" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
                </svg>
              </div>
              <div className={`toggle-icon${dark ? ' active' : ''}`}>
                <svg width="11" height="11" viewBox="0 0 11 11" fill="none" aria-hidden="true">
                  <path d="M9 6.5A4 4 0 014.5 2a4 4 0 100 8 4 4 0 004.5-3.5z" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                </svg>
              </div>
            </div>
            <div className="toggle-knob"></div>
          </button>
          <button className="tbtn" onClick={onManageLabels} title="Manage labels">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
              <path d="M1 1h5l6 6-5 5-6-6V1z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/>
              <circle cx="3.5" cy="3.5" r="0.9" fill="currentColor"/>
            </svg>
            Labels
          </button>
          <div className="backup-wrap" ref={backupMenuRef}>
            <button
              className={backupButtonClass}
              onClick={() => setBackupMenuOpen(open => !open)}
              aria-haspopup="menu"
              aria-expanded={backupMenuOpen}
              title={backupNeedsAttention ? `Backup needs attention: ${backupStatus.text}` : `Backup: ${backupStatus.text}`}
            >
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                <path d="M2 11.5h9V4.8L7.2 1.5H2v10z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/>
                <path d="M7 1.5v3.6h4" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/>
              </svg>
              Backup
              {backupNeedsAttention && <span className="backup-alert" aria-hidden="true">!</span>}
            </button>
            {backupMenuOpen && (
              <div className="backup-menu" role="menu" aria-label="Backup actions">
                <button className="backup-menu-item" role="menuitem" onClick={() => runBackupAction(onImport)}>
                  <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                    <path d="M6.5 1v8M3 6l3.5 3.5L10 6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
                    <path d="M1 12h11" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
                  </svg>
                  Import JSON
                </button>
                <button className="backup-menu-item" role="menuitem" onClick={() => runBackupAction(onExport)}>
                  <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                    <path d="M6.5 9V1M3 4l3.5-3.5L10 4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
                    <path d="M1 12h11" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
                  </svg>
                  Export JSON
                </button>
                <button className="backup-menu-item" role="menuitem" onClick={() => runBackupAction(onChooseBackup)}>
                  <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                    <path d="M4 8.2l1.5 1.5L9 6.1" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
                    <path d="M2 11.5h9V4.8L7.2 1.5H2v10z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/>
                  </svg>
                  Auto Backup
                </button>
                <div className="backup-menu-sep" role="separator"></div>
                <button className="backup-menu-item danger" role="menuitem" onClick={() => runBackupAction(onNewBoard)}>
                  <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                    <path d="M2 2h9v9H2V2z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/>
